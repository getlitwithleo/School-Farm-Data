<style>
/* Layout idea: dark field-green header with tabs, one sticky season/crop/field filter row,
   summary tiles before detail cards; single column with a bottom tab bar on phones. */
:root {
  --bg: #f5f3ec;
  --surface: #fdfcf9;
  --surface-2: #f0ece1;
  --ink: #1e2619;
  --ink-2: #4c5446;
  --muted: #676b60;
  --line: #e3ded1;
  --line-strong: #cbc3ad;
  --grid: #ebe6da;
  --green: #3b6a33;
  --green-ink: #ffffff;
  --green-soft: #e3ecd9;
  --green-text: #2c5427;
  --wheat: #d9b465;
  --wheat-soft: #f5ead0;
  --wheat-text: #6b4d10;
  --soil: #6e4a2e;
  --soil-soft: #f1e6da;
  --header: #2d4426;
  --header-ink: #f4f1e6;
  --header-muted: #c5cfb8;
  --pos: #3a7d34;
  --neg: #c4453c;
  --pos-text: #256b25;
  --neg-text: #a8321f;
  --exp: #c9b68c;
  --act: #3b6a33;
  --rain: #3f73b0;
  --rain-prev: #bdb6a3;
  --cost: #8a5a35;
  --crop-1: #dba220; --crop-2: #2e7a46; --crop-3: #c4914c; --crop-4: #4a7fb5;
  --crop-5: #b0442c; --crop-6: #12a191; --crop-7: #7c5cb8; --crop-8: #d0709a;
  --crop-x: #8b8676;
  --sev-1: #e8dcb8; --sev-2: #e3c272; --sev-3: #db9a48; --sev-4: #c2602f; --sev-5: #962d20;
  --font-display: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 12px;
  --focus: 0 0 0 3px color-mix(in srgb, var(--green) 40%, transparent);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131611; --surface: #1d201b; --surface-2: #262a23; --ink: #ecebe4; --ink-2: #c4c5b8;
    --muted: #9a9d91; --line: #30352d; --line-strong: #474d42; --grid: #2a2f27;
    --green: #6fa361; --green-ink: #0f170c; --green-soft: #243321; --green-text: #a6d197;
    --wheat: #d9b465; --wheat-soft: #3a321f; --wheat-text: #ecd193; --soil: #d1a57d; --soil-soft: #33281f;
    --header: #1a2616; --header-ink: #f0eee4; --header-muted: #aab79c;
    --pos: #5aa653; --neg: #e0645a; --pos-text: #86c97c; --neg-text: #f08a7f;
    --exp: #7d6f50; --act: #79ad69; --rain: #5a8fd0; --rain-prev: #5f5c52; --cost: #b98a5f;
    --crop-1: #b88a12; --crop-2: #2c7d45; --crop-3: #b98545; --crop-4: #4f86c9;
    --crop-5: #c4502f; --crop-6: #14998a; --crop-7: #8f74dc; --crop-8: #d65f93; --crop-x: #8f8a7a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131611; --surface: #1d201b; --surface-2: #262a23; --ink: #ecebe4; --ink-2: #c4c5b8;
  --muted: #9a9d91; --line: #30352d; --line-strong: #474d42; --grid: #2a2f27;
  --green: #6fa361; --green-ink: #0f170c; --green-soft: #243321; --green-text: #a6d197;
  --wheat: #d9b465; --wheat-soft: #3a321f; --wheat-text: #ecd193; --soil: #d1a57d; --soil-soft: #33281f;
  --header: #1a2616; --header-ink: #f0eee4; --header-muted: #aab79c;
  --pos: #5aa653; --neg: #e0645a; --pos-text: #86c97c; --neg-text: #f08a7f;
  --exp: #7d6f50; --act: #79ad69; --rain: #5a8fd0; --rain-prev: #5f5c52; --cost: #b98a5f;
  --crop-1: #b88a12; --crop-2: #2c7d45; --crop-3: #b98545; --crop-4: #4f86c9;
  --crop-5: #c4502f; --crop-6: #14998a; --crop-7: #8f74dc; --crop-8: #d65f93; --crop-x: #8f8a7a;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.45 var(--font-body); }
body.modal-open { overflow: hidden; }
h1, h2, h3, h4 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.15; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: none; box-shadow: var(--focus); }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.nowrap { white-space: nowrap; }
.sr-only { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }

/* Header */
.app-header { background: var(--header); color: var(--header-ink); }
.header-row { max-width: 1320px; margin: 0 auto; padding: 14px 20px 4px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand svg { flex: none; }
.brand-farm { font-size: 13px; color: var(--header-muted); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-title { font-size: 24px; font-weight: 700; }
.btn-header { background: transparent; color: var(--header-ink); border: 1px solid color-mix(in srgb, var(--header-ink) 35%, transparent); }
.btn-header:hover { background: color-mix(in srgb, var(--header-ink) 10%, transparent); }
.tabs { max-width: 1320px; margin: 0 auto; padding: 2px 12px 0; display: flex; gap: 2px; overflow-x: auto; }
.tab { appearance: none; border: 0; background: none; color: var(--header-muted); font-weight: 600; font-size: 16px; padding: 12px 14px; min-height: 50px; border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; }
.tab:hover { color: var(--header-ink); }
.tab[aria-selected="true"] { color: var(--header-ink); border-bottom-color: var(--wheat); }

/* Filter bar */
.filterbar { position: sticky; top: 0; z-index: 30; background: color-mix(in srgb, var(--bg) 94%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.filter-row { max-width: 1320px; margin: 0 auto; padding: 10px 20px; display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
.filter-row label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.filter-row select { min-width: 160px; }
.filter-note { margin-left: auto; font-size: 14px; color: var(--muted); align-self: center; }

/* Layout */
main { max-width: 1320px; margin: 0 auto; padding: 20px 20px 48px; display: flex; flex-direction: column; gap: 20px; }
.toolbar { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.toolbar h2 { font-size: 28px; font-weight: 700; }
.toolbar p { color: var(--muted); margin-top: 2px; }
.toolbar-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; min-width: 0; }
.card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.card-head h3 { font-size: 19px; font-weight: 700; }
.card-head .sub { color: var(--muted); font-size: 14px; margin-top: 2px; }
.card-head-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.section-title { font-size: 20px; font-weight: 700; }

/* Banner */
.banner { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--wheat-soft); color: var(--wheat-text); border: 1px solid color-mix(in srgb, var(--wheat) 55%, transparent); border-radius: var(--radius); padding: 12px 16px; }
.banner p { font-weight: 500; }
.banner .btns { display: flex; gap: 8px; flex-wrap: wrap; }
.banner.warn { background: color-mix(in srgb, var(--neg) 12%, var(--surface)); color: var(--ink); border-color: color-mix(in srgb, var(--neg) 40%, transparent); }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 15px; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn-primary { background: var(--green); color: var(--green-ink); border-color: transparent; }
.btn-primary:hover { background: color-mix(in srgb, var(--green) 88%, black); }
.btn-danger { background: var(--neg); color: #fff; border-color: transparent; }
.btn-danger:hover { background: color-mix(in srgb, var(--neg) 88%, black); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--green-text); }
.btn-ghost:hover { background: var(--green-soft); }
.btn-ghost.danger { color: var(--neg-text); }
.btn-ghost.danger:hover { background: color-mix(in srgb, var(--neg) 12%, transparent); }
.btn.sm { min-height: 40px; padding: 0 12px; font-size: 14px; }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 8px; border: 0; background: transparent; color: var(--ink-2); cursor: pointer; flex: none; }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.icon-btn.danger:hover { color: var(--neg-text); background: color-mix(in srgb, var(--neg) 12%, transparent); }
.icon-btn svg { width: 20px; height: 20px; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 0 12px; min-height: 40px; font-weight: 600; font-size: 14px; cursor: pointer; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--line-strong); }
.seg button[aria-pressed="true"] { background: var(--green); color: var(--green-ink); }

/* Form controls */
input[type="text"], input[type="number"], input[type="date"], input:not([type]), select, textarea {
  width: 100%; min-height: 46px; font-size: 16px; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); color: var(--ink); }
textarea { min-height: 84px; resize: vertical; line-height: 1.4; }
select { padding-right: 32px; appearance: none; -webkit-appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
input:focus-visible, select:focus-visible, textarea:focus-visible { border-color: var(--green); }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.form-grid .span-2 { grid-column: 1 / -1; }
.fld { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.fld > label, .fld > .lbl { font-size: 14px; font-weight: 600; color: var(--ink-2); }
.fld .hint { font-size: 13px; color: var(--muted); }
.input-unit { position: relative; }
.input-unit input { padding-right: 64px; }
.input-unit span { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 14px; color: var(--muted); pointer-events: none; }
.form-section { grid-column: 1 / -1; border-top: 1px solid var(--line); padding-top: 12px; margin-top: 2px; }
.form-section h4 { font-size: 16px; font-weight: 700; }
.calc { grid-column: 1 / -1; background: var(--surface-2); border-radius: 8px; padding: 10px 12px; font-size: 15px; font-variant-numeric: tabular-nums; }
.choice { display: flex; flex-wrap: wrap; gap: 8px; }
.choice label { position: relative; }
.choice input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.choice span { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px; border: 1px solid var(--line-strong); border-radius: 999px; font-weight: 600; font-size: 15px; background: var(--surface); cursor: pointer; }
.choice input:checked + span { background: var(--green); color: var(--green-ink); border-color: var(--green); }
.choice input:focus-visible + span { box-shadow: var(--focus); }
.choice.sev span { min-width: 52px; justify-content: center; border-radius: 8px; }
.choice.sev input:checked + span[data-sev] { color: #1e2619; border-color: transparent; }
.choice.sev input:checked + span[data-sev="1"] { background: var(--sev-1); }
.choice.sev input:checked + span[data-sev="2"] { background: var(--sev-2); }
.choice.sev input:checked + span[data-sev="3"] { background: var(--sev-3); }
.choice.sev input:checked + span[data-sev="4"] { background: var(--sev-4); color: #fff; }
.choice.sev input:checked + span[data-sev="5"] { background: var(--sev-5); color: #fff; }
.form-error { color: var(--neg-text); font-weight: 600; font-size: 14px; margin-right: auto; }
.stage-inputs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px; margin-top: 10px; }

/* Pills & chips */
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; white-space: nowrap; line-height: 1.4; }
.pill svg { width: 14px; height: 14px; }
.st-growing { background: var(--green-soft); color: var(--green-text); }
.st-ready { background: var(--wheat-soft); color: var(--wheat-text); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--wheat) 60%, transparent); }
.st-harvested { background: var(--soil-soft); color: var(--soil); }
.st-planned, .st-none { background: var(--surface-2); color: var(--ink-2); }
.sev-pill { color: #1e2619; }
.sev-pill[data-sev="1"] { background: var(--sev-1); }
.sev-pill[data-sev="2"] { background: var(--sev-2); }
.sev-pill[data-sev="3"] { background: var(--sev-3); }
.sev-pill[data-sev="4"] { background: var(--sev-4); color: #fff; }
.sev-pill[data-sev="5"] { background: var(--sev-5); color: #fff; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; background: var(--surface-2); font-size: 14px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--c, var(--crop-x)); flex: none; }
.crop-name { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; }

/* Tiles */
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.tile-label { font-size: 14px; font-weight: 600; color: var(--ink-2); }
.tile-value { font-family: var(--font-display); font-size: 32px; font-weight: 700; line-height: 1.1; letter-spacing: -.005em; }
.tile-value .unit { font-size: 17px; font-weight: 600; color: var(--muted); margin-left: 2px; }
.tile-sub { font-size: 14px; color: var(--muted); }
.tile-value.pos { color: var(--pos-text); }
.tile-value.neg { color: var(--neg-text); }
.tile.wide { grid-column: span 2; }
.tile.wide .mini-rows { columns: 2; column-gap: 28px; display: block; }
.tile.wide .mini-rows li { break-inside: avoid; padding: 2px 0; }
.segbar { display: flex; gap: 2px; height: 8px; margin: 6px 0 6px; }
.segbar span { border-radius: 4px; background: var(--c); min-width: 3px; }
.mini-rows { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; font-size: 14px; }
.mini-rows li { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.mini-rows li > span:first-child { display: inline-flex; align-items: center; gap: 7px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini-rows b { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.mini-rows .muted { font-weight: 500; }

/* Charts */
.charts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.chart-box { position: relative; width: 100%; }
.chart-box canvas { display: block; }
.chart-empty { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--muted); font-size: 15px; text-align: center; padding: 16px; border: 1px dashed var(--line-strong); border-radius: 10px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.key { display: inline-block; width: 12px; height: 12px; border-radius: 3px; background: var(--c); }
.key.line { height: 3px; width: 16px; border-radius: 2px; }
.chart-note { font-size: 13px; color: var(--muted); margin-top: 8px; }
.ibar { display: inline-block; height: 8px; border-radius: 4px; background: var(--c, var(--green)); vertical-align: middle; min-width: 2px; }
.ibar-cell { width: 34%; min-width: 90px; }
#chartTip { position: fixed; z-index: 80; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--line-strong); border-radius: 8px; box-shadow: 0 6px 20px rgba(20,18,10,.16); padding: 8px 10px; font-size: 14px; min-width: 140px; max-width: 280px; opacity: 0; transition: opacity .12s; }
#chartTip.show { opacity: 1; }
#chartTip .tt-title { font-size: 13px; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
#chartTip .tt-row { display: flex; align-items: center; gap: 8px; line-height: 1.5; }
#chartTip .tt-row i { width: 14px; height: 3px; border-radius: 2px; background: var(--c); flex: none; }
#chartTip .tt-row b { font-variant-numeric: tabular-nums; }
#chartTip .tt-row span { color: var(--ink-2); }
#chartTip .tt-note { font-size: 12px; color: var(--muted); margin-top: 3px; }

/* Attention list */
.attn { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.attn li { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.attn li:first-child { border-top: 0; padding-top: 0; }
.attn .attn-text { flex: 1; min-width: 0; font-size: 15px; }
.attn .attn-text small { display: block; color: var(--muted); font-size: 13px; }

/* Rotation */
.rotation { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 4px; align-items: center; }
.rotation li { display: inline-flex; align-items: center; gap: 4px; }
.rotation li + li::before { content: "→"; color: var(--muted); margin-right: 4px; font-weight: 600; }
.rot-chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 8px; border-radius: 999px; background: var(--surface-2); font-size: 13px; font-weight: 600; white-space: nowrap; }
.rot-chip .yr { color: var(--muted); font-variant-numeric: tabular-nums; }
.rot-chip.is-current { background: var(--green-soft); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--green) 45%, transparent); }

/* Field cards */
.field-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 18px; }
.field-card { display: flex; flex-direction: column; gap: 14px; border-top: 4px solid var(--c, var(--line-strong)); }
.fc-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.fc-head h3 { font-size: 22px; font-weight: 700; }
.fc-meta { color: var(--muted); font-size: 14px; margin-top: 2px; }
.fc-loc { display: flex; gap: 6px; align-items: flex-start; font-size: 14px; color: var(--ink-2); }
.fc-loc svg { width: 16px; height: 16px; flex: none; margin-top: 2px; color: var(--muted); }
.fc-crop { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 16px; }
.fc-crop .variety { color: var(--ink-2); }
.dsp { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.dsp .big { font-family: var(--font-display); font-size: 34px; font-weight: 700; line-height: 1; }
.dsp .of { color: var(--muted); font-size: 15px; }
.track { position: relative; height: 14px; border-radius: 7px; background: var(--surface-2); margin: 10px 0 6px; }
.track .fill { position: absolute; inset: 0 auto 0 0; border-radius: 7px; background: color-mix(in srgb, var(--c, var(--green)) 80%, var(--surface)); }
.track .tick { position: absolute; top: 50%; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: var(--surface); box-shadow: 0 0 0 2px var(--line-strong); }
.track .tick.done { background: var(--ink); box-shadow: 0 0 0 2px var(--surface); }
.track-labels { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); gap: 8px; }
.stage-now { font-size: 15px; }
.stage-now b { font-weight: 700; }
details.stages summary { cursor: pointer; font-weight: 600; color: var(--green-text); min-height: 40px; display: flex; align-items: center; list-style: none; }
details.stages summary::-webkit-details-marker { display: none; }
details.stages summary::before { content: "▸"; margin-right: 8px; transition: transform .15s; }
details.stages[open] summary::before { transform: rotate(90deg); }
.stage-list { list-style: none; margin: 0; padding: 0; font-size: 14px; }
.stage-list li { display: grid; grid-template-columns: 76px 1fr auto; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); align-items: baseline; }
.stage-list .code { font-weight: 700; font-variant-numeric: tabular-nums; }
.stage-list .when { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.stage-list .when .ok { color: var(--green-text); font-weight: 600; }
.stage-list li.is-current { background: var(--green-soft); margin: 0 -8px; padding: 6px 8px; border-radius: 6px; border-top-color: transparent; }
.kv { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.kv div { display: flex; flex-direction: column; min-width: 0; }
.kv span { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.kv b { font-size: 17px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kv b.pos { color: var(--pos-text); } .kv b.neg { color: var(--neg-text); }
.fc-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; padding-top: 4px; }
.next-season { font-size: 14px; background: var(--surface-2); border-radius: 8px; padding: 8px 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* Tables */
.table-wrap { position: relative; overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; font-size: 15px; }
th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 700; padding: 8px 10px; border-bottom: 1px solid var(--line-strong); white-space: nowrap; }
td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tbody tr:hover td { background: color-mix(in srgb, var(--surface-2) 60%, transparent); }
table.dense { font-size: 14px; } table.dense td, table.dense th { padding-left: 7px; padding-right: 7px; }
tfoot td { font-weight: 700; border-top: 1px solid var(--line-strong); border-bottom: 0; background: var(--surface-2); }
td.actions { white-space: nowrap; text-align: right; width: 1%; }
td .pos, .pos-text { color: var(--pos-text); font-weight: 700; }
td .neg, .neg-text { color: var(--neg-text); font-weight: 700; }
.proj { font-size: 12px; font-weight: 700; color: var(--wheat-text); background: var(--wheat-soft); border-radius: 4px; padding: 1px 6px; margin-left: 6px; white-space: nowrap; }
.more-row { display: flex; justify-content: center; padding-top: 12px; }
.cat-bars { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 24px; }
.cat-bars li { display: grid; grid-template-columns: 110px 1fr auto; gap: 10px; align-items: center; font-size: 14px; }
.cat-bars .track-sm { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.cat-bars .track-sm i { display: block; height: 100%; background: var(--cost); border-radius: 0 4px 4px 0; }
.cat-bars b { font-variant-numeric: tabular-nums; white-space: nowrap; }

/* Trials */
.trial-setup { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.trial-setup p { font-size: 15px; color: var(--ink-2); flex: 1 1 360px; }
tr.check-row td { background: color-mix(in srgb, var(--exp) 12%, transparent); }
tr.blank-row td { color: var(--muted); }

.fc-trials { border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.fc-trials-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.fc-trial-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.trial-link { width: 100%; text-align: left; display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; min-height: 48px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); cursor: pointer; }
.trial-link:hover { background: var(--surface-2); }
.tl-name { font-weight: 700; color: var(--green-text); }
.tl-meta { font-size: 13px; color: var(--muted); }
.choice-list { display: flex; flex-direction: column; gap: 8px; }
.choice-list .btn { justify-content: flex-start; white-space: normal; text-align: left; min-height: 48px; }

/* Observations */
.obs-list { display: flex; flex-direction: column; gap: 10px; }
.obs { display: flex; gap: 12px; padding: 12px 12px 12px 14px; border: 1px solid var(--line); border-left: 5px solid var(--sevc, var(--line-strong)); border-radius: 10px; background: var(--surface); }
.obs[data-sev="1"] { --sevc: var(--sev-1); } .obs[data-sev="2"] { --sevc: var(--sev-2); } .obs[data-sev="3"] { --sevc: var(--sev-3); }
.obs[data-sev="4"] { --sevc: var(--sev-4); } .obs[data-sev="5"] { --sevc: var(--sev-5); }
.obs-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.obs-top { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.obs-top .date { font-weight: 700; font-variant-numeric: tabular-nums; }
.obs-note { color: var(--ink); }
.obs-actions { display: flex; flex-direction: column; gap: 2px; }
.rain-summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
.rain-summary div { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.rain-summary span { display: block; font-size: 12px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.rain-summary b { font-family: var(--font-display); font-size: 24px; }
.quick { display: grid; grid-template-columns: 1.2fr 1.4fr 1fr auto; gap: 10px; align-items: end; margin-bottom: 16px; }

/* Modal */
#modalRoot { position: fixed; inset: 0; z-index: 90; display: none; }
#modalRoot.open { display: block; }
.modal-backdrop { position: absolute; inset: 0; background: rgba(18, 20, 14, .5); }
.modal { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(620px, calc(100% - 32px)); max-height: calc(100% - 48px); background: var(--surface); border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.3); display: flex; flex-direction: column; }
.modal.wide { width: min(760px, calc(100% - 32px)); }
.modal form { display: flex; flex-direction: column; min-height: 0; flex: 1; }
.modal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 14px 10px 20px; border-bottom: 1px solid var(--line); }
.modal-head h2 { font-size: 22px; font-weight: 700; }
.modal-body { padding: 16px 20px; overflow-y: auto; flex: 1; min-height: 0; }
.modal-foot { display: flex; gap: 10px; justify-content: flex-end; align-items: center; padding: 12px 20px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.data-sec { display: flex; flex-direction: column; gap: 10px; padding: 14px 0; border-top: 1px solid var(--line); }
.data-sec:first-child { border-top: 0; padding-top: 0; }
.data-sec h3 { font-size: 17px; font-weight: 700; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }

/* Toast */
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 100; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast { pointer-events: auto; background: var(--ink); color: var(--bg); padding: 10px 14px 10px 16px; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.25); display: flex; gap: 14px; align-items: center; font-weight: 600; font-size: 15px; }
.toast button { background: transparent; border: 1px solid color-mix(in srgb, var(--bg) 40%, transparent); color: var(--bg); border-radius: 6px; min-height: 36px; padding: 0 12px; font-weight: 700; cursor: pointer; }

/* Bottom nav (phones) */
.bottomnav { display: none; }

@media (max-width: 1000px) {
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 900px) {
  .charts, .grid-2 { grid-template-columns: minmax(0, 1fr); }
  .cat-bars { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 720px) {
  .header-row { padding: 10px 14px 10px; }
  .brand-title { font-size: 20px; }
  .tabs { display: none; }
  .filter-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 8px 12px; gap: 8px; }
  .filter-row select { min-width: 0; padding-left: 10px; font-size: 15px; }
  .filter-row .filter-clear, .filter-note { grid-column: 1 / -1; margin-left: 0; }
  .filter-row .filter-clear { justify-self: start; }
  main { padding: 14px 12px 104px; gap: 16px; }
  .card { padding: 14px; }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .tile.wide { grid-column: 1 / -1; }
  .tile-value { font-size: 26px; }
  .toolbar h2 { font-size: 24px; }
  .field-grid { grid-template-columns: minmax(0, 1fr); }
  .form-grid, .stage-inputs { grid-template-columns: minmax(0, 1fr); }
  .quick { grid-template-columns: 1fr 1fr; }
  .quick .q-gauge { grid-column: 1 / -1; order: -1; }
  .rain-summary b { font-size: 20px; }
  .modal, .modal.wide { left: 0; right: 0; top: auto; bottom: 0; transform: none; width: 100%; max-height: 94%; border-radius: 16px 16px 0 0; }
  .bottomnav { display: grid; grid-template-columns: repeat(6, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--surface); border-top: 1px solid var(--line-strong); padding-bottom: env(safe-area-inset-bottom); }
  .bottomnav button { appearance: none; border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 62px; font-size: 11px; font-weight: 600; color: var(--muted); cursor: pointer; padding: 6px 1px; }
  .bottomnav button svg { width: 24px; height: 24px; }
  .bottomnav button[aria-selected="true"] { color: var(--green-text); }
  .bottomnav button[aria-selected="true"] svg { color: var(--green); }
  #toast { bottom: 84px; }
  .rtable thead { display: none; }
  .rtable, .rtable tbody, .rtable tfoot, .rtable tr, .rtable td { display: block; width: 100%; }
  .rtable tr { border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; margin-bottom: 10px; background: var(--surface); }
  .rtable tbody tr:hover td { background: none; }
  .rtable td { display: flex; justify-content: space-between; align-items: center; gap: 12px; border: 0; padding: 6px 0; text-align: right; }
  .rtable td::before { content: attr(data-label); color: var(--muted); font-size: 13px; font-weight: 600; text-align: left; white-space: nowrap; }
  .rtable td.rt-title { font-weight: 700; font-size: 17px; justify-content: flex-start; text-align: left; border-bottom: 1px solid var(--line); padding-bottom: 8px; margin-bottom: 2px; }
  .rtable td.rt-title::before { display: none; }
  .rtable td.actions { width: 100%; justify-content: flex-end; }
  .rtable td.actions::before { display: none; }
  .rtable tfoot tr { background: var(--surface-2); }
  .rtable tfoot td { background: none; border: 0; }
  .rtable td.ibar-cell { width: 100%; }
  .kv b { font-size: 16px; }
  .rtable tr.blank-row td:not(.rt-title):not(.keep):not(.actions) { display: none; }
  .rtable tr.check-row { background: color-mix(in srgb, var(--exp) 12%, var(--surface)); }
  .rtable tr.check-row td { background: none; }
}
@media (max-width: 400px) {
  .tiles .tile-value { font-size: 24px; }
  .rain-summary { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
@media (forced-colors: active) {
  .segbar span, .ibar, .dot, .key { forced-color-adjust: none; }
}
/* ---- School Farm look: emblem blue + corn gold, record-book styling ---- */
:root {
  --blue: #1b4f8f; --blue-deep: #12355f; --gold: #f2b705; --gold-ink: #5a4300;
  --bg: #f3efe4; --surface: #fffdf7; --surface-2: #ece6d6; --line: #d8cfba; --line-strong: #a99f87;
  --ink: #1d2230; --ink-2: #3e4556; --muted: #646a78;
  --header: var(--blue-deep); --header-ink: #fbf7ea; --header-muted: #b9c6dc; --wheat: var(--gold);
  --font-display: "Bitter", Georgia, serif;
  --font-body: "Libre Franklin", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, monospace;
  --radius: 3px;
  --focus: 0 0 0 3px color-mix(in srgb, var(--blue) 45%, transparent);
}
:root[data-theme="dark"] { --blue: #6d9be0; --blue-deep: #0d1d33; --bg: #12151b; --surface: #1a1e26; --surface-2: #232834; --line: #313848; --line-strong: #4a5367; --ink: #ecebe4; --ink-2: #c4c7d0; --muted: #969cab; --header: #0d1d33; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --blue: #6d9be0; --blue-deep: #0d1d33; --bg: #12151b; --surface: #1a1e26; --surface-2: #232834; --line: #313848; --line-strong: #4a5367; --ink: #ecebe4; --ink-2: #c4c7d0; --muted: #969cab; --header: #0d1d33; } }

body { font-size: 15.5px; }
.app-header { border-bottom: 5px solid var(--gold); background: var(--header); }
.header-row { padding: 14px 20px 8px; }
.brand { gap: 14px; }
.brand-logo { display: block; height: 74px; width: auto; filter: drop-shadow(0 1px 0 rgba(0,0,0,.25)); }
.brand-title { font-size: 34px; font-weight: 800; letter-spacing: -.01em; line-height: 1; }
.brand-farm { margin-top: 5px; font-size: 12px; letter-spacing: .14em; color: var(--gold); }
.btn-header { border-radius: 2px; border-color: color-mix(in srgb, var(--header-ink) 45%, transparent); }
.tab { text-transform: uppercase; font-size: 13px; letter-spacing: .09em; font-weight: 700; min-height: 44px; border-bottom-width: 4px; margin-bottom: -5px; }
.tab[aria-selected="true"] { border-bottom-color: var(--gold); }

.filterbar { background: var(--surface-2); backdrop-filter: none; -webkit-backdrop-filter: none; border-bottom: 1px solid var(--line-strong); }
.filter-row label { letter-spacing: .1em; font-size: 11px; color: var(--ink-2); }

.toolbar { border-bottom: 2px solid var(--ink); padding-bottom: 8px; }
.toolbar h2 { font-size: 30px; font-weight: 800; }
.card, .tile { border-radius: var(--radius); border-color: var(--line-strong); box-shadow: 2px 2px 0 var(--line); }
.card-head { border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.card-head h3 { font-size: 18px; font-weight: 700; }
.tile { border-top: 3px solid var(--blue); }
.tile-label { text-transform: uppercase; letter-spacing: .08em; font-size: 11.5px; font-weight: 700; color: var(--muted); }
.tile-value, .dsp .big, .rain-summary b { font-family: var(--font-num); font-weight: 600; letter-spacing: -.02em; }
.tile-value { font-size: 28px; }
.field-card { border-top-width: 5px; }
.fc-head h3 { font-size: 21px; }
td.num, .kv b, .stage-list .code, .stage-list .when, .obs-top .date { font-family: var(--font-num); font-size: .94em; }
th { color: var(--ink-2); border-bottom: 2px solid var(--ink); letter-spacing: .08em; }
tbody tr:nth-child(even) td { background: color-mix(in srgb, var(--surface-2) 45%, transparent); }
.kv, .rain-summary > div, .next-season, .calc { border-radius: 2px; border: 1px dashed var(--line-strong); }

.btn, .icon-btn, .seg, input[type="text"], input[type="number"], input[type="date"], input:not([type]), select, textarea, .modal, .toast { border-radius: 2px; }
.btn { font-weight: 700; }
.btn-primary { background: var(--blue); border-color: var(--blue); color: #fff; box-shadow: 2px 2px 0 var(--blue-deep); }
.btn-primary:hover { background: var(--blue-deep); }
.btn-ghost { color: var(--blue); }
.btn-ghost:hover { background: color-mix(in srgb, var(--blue) 12%, transparent); }
.seg button[aria-pressed="true"], .choice input:checked + span { background: var(--blue); border-color: var(--blue); color: #fff; }
input:focus-visible, select:focus-visible, textarea:focus-visible { border-color: var(--blue); }
details.stages summary { color: var(--blue); }

.pill, .chip, .rot-chip, .choice span, .proj { border-radius: 2px; }
.pill { text-transform: uppercase; letter-spacing: .06em; font-size: 11.5px; }
.banner { border-radius: 2px; border-left: 6px solid var(--gold); background: color-mix(in srgb, var(--gold) 16%, var(--surface)); color: var(--ink); }
.obs { border-radius: 2px; }
.modal { box-shadow: 6px 6px 0 rgba(0,0,0,.25); }
.modal-head { border-bottom: 2px solid var(--ink); }
.bottomnav button[aria-selected="true"] { color: var(--blue); }
.auto-note { font-size: 14px; color: var(--ink-2); background: color-mix(in srgb, var(--blue) 8%, var(--surface)); border-left: 4px solid var(--blue); padding: 8px 12px; margin-bottom: 12px; }
.auto-tag { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--blue); border: 1px solid currentColor; border-radius: 2px; padding: 0 5px; margin-left: 4px; }
.bottomnav button[aria-selected="true"] svg { color: var(--blue); }
th.num { font-family: var(--font-body); }
@media (max-width: 720px) {
  .brand-logo { height: 54px; }
  .brand-farm { display: none; }
  .btn-header { min-height: 40px; padding: 0 12px; font-size: 14px; }
  .brand-title { font-size: 26px; }
  .modal, .modal.wide { border-radius: 4px 4px 0 0; }
}
</style>
</head>

function stg(str) {
  return String(str || '').split(',').map(s => s.trim()).filter(Boolean).map(s => {
    const parts = s.split(':').map(x => x.trim());
    if (parts.length >= 3) return { code: parts[0], name: parts.slice(1, -1).join(':'), days: +parts[parts.length - 1] };
    return { code: parts[0], name: parts[0], days: +parts[1] };
  }).filter(s => s.code && isFinite(s.days)).sort((a, b) => a.days - b.days);
}

/* ---- Automatic rain (daily weather-station totals written by a scheduled task into the shared store) ---- */
let AUTO_RAIN = [], AUTO_STATE = 'off';
function mergeAutoRain() {
  if (S.sample || !AUTO_RAIN.length) return false;
  const hidden = new Set(S.settings.hiddenAuto || []);
  let changed = false;
  for (const a of AUTO_RAIN) {
    if (!a || typeof a.date !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(a.date)) continue;
    const inches = Math.round(Math.max(0, Number(a.inches)) * 100) / 100;
    if (!isFinite(inches) || inches <= 0) continue;
    const id = 'auto-' + a.date;
    if (hidden.has(id) || S.rainfall.some(r => r.id === id)) continue;
    if (S.rainfall.some(r => r.fieldId === 'farm' && r.date === a.date)) continue;
    S.rainfall.push({ id, date: a.date, fieldId: 'farm', inches });
    changed = true;
  }
  return changed;
}
function lastAutoDate() { let d = ''; for (const a of AUTO_RAIN) if (a && typeof a.date === 'string' && a.date > d) d = a.date; return d; }
function autoRainNote() {
  if (AUTO_STATE === 'off') return '';
  if (AUTO_STATE === 'loading') return '<p class="auto-note">Checking for automatic rain readings…</p>';
  if (AUTO_STATE === 'stale') return '<p class="auto-note">Automatic rain readings can\'t be reached right now. Readings you log by hand still work.</p>';
  if (S.sample) return '<p class="auto-note">Rain from the Waukesha County Airport weather station is added to the farm gauge every morning once you start your own farm (Data &amp; export → Start with an empty farm).</p>';
  const last = lastAutoDate();
  return `<p class="auto-note">The farm gauge fills in automatically each morning from the Waukesha County Airport weather station${last ? `, most recently checked for ${fmtDate(last, true)}` : ''}. Readings you log by hand for the farm gauge take priority.</p>`;
}

function viewDashboard() {
  const F = filt(), E = F.plantings.map(econ);
  const acres = sum(E, e => e.acres), irr = sum(E.filter(e => e.field && e.field.irrigated), e => e.acres);
  const totalCost = sum(F.inputs, i => i.cost), revenue = sum(E, e => e.revenue), net = revenue - totalCost;
  const nHarv = E.filter(e => e.harvested).length, vAc = viewAcres(F) || acres;
  const byCrop = [];
  for (const e of E) {
    let g = byCrop.find(x => x.crop.id === e.crop.id);
    if (!g) { g = { crop: e.crop, acres: 0, n: 0, hAc: 0, hSum: 0, eSum: 0, pSum: 0 }; byCrop.push(g); }
    g.acres += e.acres; g.n++; g.pSum += e.expY * e.acres;
    if (e.harvested) { g.hAc += e.acres; g.hSum += e.act * e.acres; g.eSum += e.expY * e.acres; }
  }
  byCrop.sort((a, b) => S.crops.indexOf(a.crop) - S.crops.indexOf(b.crop));
  const tile = (label, value, sub, cls = '') => `<div class="tile ${cls}"><div class="tile-label">${label}</div>${value}${sub ? `<div class="tile-sub">${sub}</div>` : ''}</div>`;
  const netCls = net >= 0 ? 'pos' : 'neg';
  let html = `<section class="tiles" aria-label="Season summary">
    ${tile('Total acres', `<div class="tile-value">${nf(acres)}<span class="unit">ac</span></div>`, `${E.length} field${E.length === 1 ? '' : 's'} planted · ${nf(irr)} ac irrigated`)}
    ${tile('Total costs', `<div class="tile-value">${moneyC(totalCost)}</div>`, `${money(vAc ? totalCost / vAc : 0)}/ac · ${F.inputs.length} input entries`)}
    ${tile('Projected revenue', `<div class="tile-value">${moneyC(revenue)}</div>`, `${money(acres ? revenue / acres : 0)}/ac · ${nHarv} of ${E.length} harvested${nHarv < E.length ? ', rest at expected yield' : ''}`)}
    ${tile('Net profit', `<div class="tile-value ${netCls}">${net >= 0 ? '▲ ' : '▼ '}${moneyC(net)}</div>`, `${signedMoney(vAc ? net / vAc : 0)}/ac after all costs`)}
    ${tile('Acres by crop', byCrop.length ? `<div class="segbar" role="img" aria-label="${esc(byCrop.map(g => `${g.crop.name} ${nf(g.acres)} acres`).join(', '))}">${byCrop.map(g => `<span style="flex:${g.acres} 1 0;--c:${cropVar(g.crop)}"></span>`).join('')}</div>
      <ul class="mini-rows">${byCrop.map(g => `<li><span><i class="dot" style="--c:${cropVar(g.crop)}"></i>${esc(g.crop.name)}</span><b>${nf(g.acres)} ac <span class="muted">${acres ? Math.round(g.acres / acres * 100) : 0}%</span></b></li>`).join('')}</ul>` : '<div class="tile-sub">No crops planted</div>', '', 'wide')}
    ${tile('Average yield by crop', byCrop.length ? `<ul class="mini-rows" style="margin-top:4px">${byCrop.map(g => {
      const has = g.hAc > 0, v = has ? g.hSum / g.hAc : g.pSum / g.acres;
      return `<li><span><i class="dot" style="--c:${cropVar(g.crop)}"></i>${esc(g.crop.name)}</span><b>${fmtYield(v)} <span class="muted">${esc(g.crop.unit)}${has ? ` · exp ${fmtYield(g.eSum / g.hAc)}` : ' · projected'}</span></b></li>`;
    }).join('')}</ul>` : '<div class="tile-sub">No yields yet</div>', 'Acre-weighted. A crop with no harvested fields shows its projected yield.', 'wide')}
  </section>`;

  // Chart 1: acres by crop
  const c1 = chartCard({ key: 'acres', title: 'Acres by crop', sub: `Planted acres · ${F.y}`, height: 250,
    empty: byCrop.length ? null : 'No crops planted for this selection.',
    aria: `Bar chart of planted acres by crop: ${byCrop.map(g => `${g.crop.name} ${nf(g.acres)} acres`).join(', ')}`,
    table: { head: [{ t: 'Crop' }, { t: 'Acres', num: 1 }, { t: 'Fields', num: 1 }, { t: 'Share', num: 1 }],
      rows: byCrop.map(g => [`<span class="crop-name"><i class="dot" style="--c:${cropVar(g.crop)}"></i>${esc(g.crop.name)}</span>`, nf(g.acres) + ' ac', g.n, (acres ? Math.round(g.acres / acres * 100) : 0) + '%']),
      bar: { vals: byCrop.map(g => g.acres), color: i => cropVar(byCrop[i].crop), label: 'Acres' } },
    build: () => ({ type: 'bar', data: { labels: byCrop.map(g => g.crop.name), datasets: [{ label: 'Planted acres', data: byCrop.map(g => g.acres), backgroundColor: byCrop.map(g => cropColor(g.crop)) }] },
      meta: { fmt: v => `${nf(v)} ac`, valueLabel: v => nf(v) }, opts: { yTitle: 'acres' } }) });

  // Chart 2: yield vs expected
  const units = [...new Set(E.map(e => e.crop.unit))];
  const unitAc = u => sum(E.filter(e => e.crop.unit === u), e => e.acres);
  const unit = units.includes(UI.yieldUnit) ? UI.yieldUnit : units.sort((a, b) => unitAc(b) - unitAc(a))[0] || 'bu/ac';
  const EY = E.filter(e => e.crop.unit === unit);
  const unitSeg = units.length > 1 ? `<div class="seg" role="group" aria-label="Yield unit">${units.map(u => `<button type="button" data-act="yield-unit" data-id="${u}" aria-pressed="${u === unit}">${u}</button>`).join('')}</div>` : '';
  const c2 = chartCard({ key: 'yield', title: 'Yield per acre by field', sub: `Actual vs expected · ${unit} · ${F.y}`, height: 270, headExtra: unitSeg,
    legend: legendItem('var(--exp)', 'Expected') + legendItem('var(--act)', 'Actual'),
    empty: EY.length ? null : 'No planted fields for this selection.',
    aria: `Grouped bar chart of expected and actual yield per field in ${unit}`,
    table: { head: [{ t: 'Field' }, { t: 'Crop' }, { t: 'Expected', num: 1 }, { t: 'Actual', num: 1 }, { t: 'vs expected', num: 1 }],
      rows: EY.map(e => [esc(e.field.name), esc(e.crop.name), fmtYield(e.expY), e.harvested ? fmtYield(e.act) : '<span class="muted">Not harvested</span>', e.pct != null ? `<span class="${e.pct >= 1 ? 'pos' : 'neg'}">${e.pct >= 1 ? '+' : '−'}${Math.abs(Math.round((e.pct - 1) * 100))}%</span>` : '—']) },
    build: () => ({ type: 'bar', data: { labels: EY.map(e => wrapLabel(e.field.name)), datasets: [
      { label: 'Expected', data: EY.map(e => e.expY), backgroundColor: css('--exp') },
      { label: 'Actual', data: EY.map(e => e.harvested ? e.act : null), backgroundColor: css('--act') }] },
      meta: { fmt: (v, dp) => v == null ? 'Not harvested' : `${fmtYield(v)} ${unit}`, title: i => `${EY[i].field.name} · ${EY[i].crop.name}`,
        note: i => EY[i].pct != null ? `${EY[i].pct >= 1 ? '+' : '−'}${Math.abs(Math.round((EY[i].pct - 1) * 100))}% vs expected` : 'Not harvested yet' }, opts: { yTitle: unit } }) });

  // Chart 3: cost by category
  const cats = CATEGORIES.map(c => ({ c, total: sum(F.inputs.filter(i => i.category === c.id), i => i.cost) })).filter(x => x.total > 0).sort((a, b) => b.total - a.total);
  const c3 = chartCard({ key: 'costs', title: 'Cost breakdown by category', sub: `Total $ for ${nf(vAc)} ac · ${F.y}`, height: Math.max(220, cats.length * 30 + 40),
    empty: cats.length ? null : 'No input costs logged for this selection.',
    aria: `Horizontal bar chart of costs by category: ${cats.map(x => `${x.c.label} ${money(x.total)}`).join(', ')}`,
    table: { head: [{ t: 'Category' }, { t: 'Total', num: 1 }, { t: '$/ac', num: 1 }, { t: 'Share', num: 1 }],
      rows: cats.map(x => [esc(x.c.label), money(x.total), money(vAc ? x.total / vAc : 0, 2), Math.round(x.total / totalCost * 100) + '%']),
      foot: ['Total', money(totalCost), money(vAc ? totalCost / vAc : 0, 2), '100%'], bar: { vals: cats.map(x => x.total), color: () => 'var(--cost)', label: 'Total' } },
    build: () => ({ type: 'bar', data: { labels: cats.map(x => x.c.label), datasets: [{ label: 'Cost', data: cats.map(x => r2(x.total)), backgroundColor: css('--cost') }] },
      meta: { fmt: v => money(v), note: i => `${money(vAc ? cats[i].total / vAc : 0, 2)}/ac · ${Math.round(cats[i].total / totalCost * 100)}% of costs`, valueLabel: v => v >= 1000 ? `$${(v / 1000).toFixed(1)}K` : money(v) },
      opts: { indexAxis: 'y', xMoney: true } }) });

  // Chart 4: cumulative rainfall
  const RV = rainView(F);
  const monthly = [];
  for (const r of RV.series[0].readings) { const k = r.date.slice(0, 7); let m = monthly.find(x => x.k === k); if (!m) { m = { k, v: 0 }; monthly.push(m); } m.v += r.inches; }
  let cum = 0;
  const c4 = chartCard({ key: 'rain', title: 'Cumulative rainfall', sub: RV.sub, height: 270,
    legend: RV.series.length > 1 ? RV.series.map(s => legendItem(`var(${s.color})`, s.label, true)).join('') : '',
    empty: RV.series[0].readings.length ? null : 'No rainfall logged for this season yet.',
    aria: `Line chart of cumulative rainfall, ${nf(RV.total, 2)} inches total`,
    table: { head: [{ t: 'Month' }, { t: 'Rain (in)', num: 1 }, { t: 'Cumulative (in)', num: 1 }],
      rows: monthly.map(m => { cum += m.v; return [new Date(m.k + '-15T00:00:00Z').toLocaleDateString('en-US', { month: 'long', year: 'numeric', timeZone: 'UTC' }), nf(m.v, 2), nf(cum, 2)]; }),
      bar: { vals: monthly.map(m => m.v), color: () => 'var(--rain)', label: 'Rain' } },
    note: `${RV.series[0].readings.length} rain events · ${nf(RV.total, 2)} in total`,
    build: () => buildRainConfig(RV) });

  // Chart 5: profit per acre
  const c5 = chartCard({ key: 'profit', title: 'Profit per acre by field', sub: `Net $/ac after all costs · ${F.y}`, height: 270,
    legend: legendItem('var(--pos)', 'Profit') + legendItem('var(--neg)', 'Loss') + (E.some(e => !e.harvested) ? legendItem('color-mix(in srgb, var(--pos) 45%, var(--surface))', 'Projected (not harvested)') : ''),
    empty: E.length ? null : 'No planted fields for this selection.',
    aria: `Bar chart of profit per acre: ${E.map(e => `${e.field.name} ${signedMoney(e.netAc)}`).join(', ')}`,
    table: { head: [{ t: 'Field' }, { t: 'Crop' }, { t: 'Net $/ac', num: 1 }, { t: 'Net total', num: 1 }],
      rows: E.map(e => [esc(e.field.name) + (e.harvested ? '' : '<span class="proj">Projected</span>'), esc(e.crop.name), `<span class="${e.netAc >= 0 ? 'pos' : 'neg'}">${signedMoney(e.netAc)}</span>`, money(e.net)]),
      bar: { vals: E.map(e => e.netAc), color: i => E[i].netAc >= 0 ? 'var(--pos)' : 'var(--neg)', label: 'Net $/ac' } },
    build: () => ({ type: 'bar', data: { labels: E.map(e => wrapLabel(e.field.name)), datasets: [{ label: 'Net profit', data: E.map(e => r2(e.netAc)),
      backgroundColor: E.map(e => { const c = css(e.netAc >= 0 ? '--pos' : '--neg'); return e.harvested ? c : c + '73'; }) }] },
      meta: { fmt: v => `${signedMoney(v)}/ac`, title: i => `${E[i].field.name} · ${E[i].crop.name}`, note: i => `${money(E[i].net)} total${E[i].harvested ? '' : ' · projected at expected yield'}`, valueLabel: v => signedMoney(v) },
      opts: { yMoney: true, zeroLine: true } }) });

  const items = attentionItems(F);
  const attn = `<article class="card"><div class="card-head"><div><h3>Needs attention</h3><p class="sub">Harvest timing, missing yields and severe scouting reports · ${F.y}</p></div></div>
    ${items.length ? `<ul class="attn">${items.map(it => `<li><span class="pill ${it.cls || 'sev-pill'}"${it.sev ? ` data-sev="${it.sev}"` : ''}>${it.sev ? ICON.alert : ''}${esc(it.pill)}</span><div class="attn-text">${esc(it.text)}${it.small ? `<small>${esc(it.small)}</small>` : ''}</div><button type="button" class="btn sm" data-act="${it.act}" data-id="${esc(it.id)}">${esc(it.btn)}</button></li>`).join('')}</ul>` : '<p class="muted">Nothing needs attention for this selection.</p>'}</article>`;

  html += `<section class="charts">${c1}${c2}${c3}${c4}${c5}${attn}</section>`;
  html += viewCompare();
  return html;
}

function viewCompare() {
  const cf = UI.field !== 'all' ? UI.field : (UI.compareField && fieldById(UI.compareField) ? UI.compareField : (S.fields[0] || {}).id);
  if (!cf) return '';
  const f = fieldById(cf);
  const ps = S.plantings.filter(p => p.fieldId === cf).sort((a, b) => a.year - b.year);
  const E2 = ps.map(econ), rains = ps.map(seasonRain);
  const metric = ['profit', 'yield', 'cost'].includes(UI.compareMetric) ? UI.compareMetric : 'profit';
  const M = { profit: { label: 'Profit $/ac', val: e => e.netAc }, yield: { label: 'Yield % of expected', val: e => e.pct != null ? e.pct * 100 : null }, cost: { label: 'Cost $/ac', val: e => e.costAc } }[metric];
  const seg = `<div class="seg" role="group" aria-label="Metric">${[['profit', 'Profit $/ac'], ['yield', 'Yield vs expected'], ['cost', 'Cost $/ac']].map(([k, l]) => `<button type="button" data-act="compare-metric" data-id="${k}" aria-pressed="${k === metric}">${l}</button>`).join('')}</div>`;
  const sel = UI.field !== 'all' ? `<span class="chip">${esc(f.name)} (from filter)</span>` : `<label class="sr-only" for="cmpField">Field to compare</label><select id="cmpField" style="width:auto;min-width:200px">${fieldOptions(cf)}</select>`;
  const spec = { key: 'compare', title: 'Compare seasons', sub: `${esc(f.name)} · ${nf(f.acres)} ac · same field across years`, height: 250, headExtra: sel + seg,
    empty: E2.length ? null : 'No seasons recorded for this field yet.',
    aria: `Bar chart of ${M.label} by season for ${f.name}`,
    table: { head: [{ t: 'Season' }, { t: 'Crop & variety' }, { t: 'Yield', num: 1 }, { t: 'vs exp.', num: 1 }, { t: 'Cost $/ac', num: 1 }, { t: 'Revenue $/ac', num: 1 }, { t: 'Profit $/ac', num: 1 }, { t: 'Season rain', num: 1 }],
      rows: E2.map((e, i) => [String(e.p.year), `<span class="crop-name"><i class="dot" style="--c:${cropVar(e.crop)}"></i>${esc(e.crop.name)}</span> <span class="muted">${esc(e.p.variety)}</span>`,
        `${fmtYield(e.yld)} ${esc(e.crop.unit)}${e.harvested ? '' : '<span class="proj">Projected</span>'}`, e.pct != null ? `<span class="${e.pct >= 1 ? 'pos' : 'neg'}">${Math.round(e.pct * 100)}%</span>` : '—',
        money(e.costAc), money(e.revAc), `<span class="${e.netAc >= 0 ? 'pos' : 'neg'}">${signedMoney(e.netAc)}</span>`, `${nf(rains[i].total, 1)} in`]) },
    build: () => ({ type: 'bar', data: { labels: E2.map(e => [String(e.p.year), e.crop.name]), datasets: [{ label: M.label, data: E2.map(e => { const v = M.val(e); return v == null ? null : r2(v); }),
      backgroundColor: E2.map(e => metric === 'profit' ? (css(e.netAc >= 0 ? '--pos' : '--neg') + (e.harvested ? '' : '73')) : metric === 'yield' ? cropColor(e.crop) : css('--cost')) }] },
      meta: { fmt: v => v == null ? 'No yield yet' : metric === 'yield' ? `${Math.round(v)}% of expected` : metric === 'profit' ? `${signedMoney(v)}/ac` : `${money(v)}/ac`,
        title: i => `${E2[i].p.year} · ${E2[i].crop.name} ${E2[i].p.variety}`, note: i => `${fmtYield(E2[i].yld)} ${E2[i].crop.unit} · ${nf(rains[i].total, 1)} in season rain`,
        valueLabel: v => metric === 'yield' ? Math.round(v) + '%' : metric === 'profit' ? signedMoney(v) : money(v), refLine: metric === 'yield' ? { v: 100, label: 'Expected' } : null },
      opts: { yMoney: metric !== 'yield', zeroLine: metric === 'profit', yPct: metric === 'yield' } }) };
  const showTable = !!UI.tableView.compare || chartLib === 'failed';
  if (!spec.empty) pendingCharts.push(spec);
  return `<article class="card" id="cc-compare">
    <div class="card-head"><div><h3>${spec.title}</h3><p class="sub">${spec.sub}</p></div><div class="card-head-actions">${spec.headExtra}</div></div>
    <div style="margin-bottom:12px">${rotationHtml(cf, UI.year)}</div>
    ${spec.empty ? `<div class="chart-empty" style="height:120px">${spec.empty}</div>` : `<div class="chart-box" style="height:${spec.height}px"${chartLib === 'failed' ? ' hidden' : ''}><canvas id="ch-compare" role="img" aria-label="${esc(spec.aria)}"></canvas></div>`}
    <div style="margin-top:14px">${tableHtml(spec.table)}</div>
  </article>`;
}

function rotationHtml(fieldId, hl) {
  const ps = S.plantings.filter(p => p.fieldId === fieldId).sort((a, b) => a.year - b.year);
  if (!ps.length) return '<p class="muted small">No rotation history yet.</p>';
  return `<ol class="rotation" aria-label="Crop rotation history">${ps.map(p => { const c = cropById(p.cropId); return `<li><span class="rot-chip${p.year === hl ? ' is-current' : ''}"><span class="yr">${p.year}</span><i class="dot" style="--c:${cropVar(c)}"></i>${esc(c.name)}</span></li>`; }).join('')}</ol>`;
}

/* ================= Fields ================= */
function viewFields() {
  const F = filt(), y = F.y;
  const list = S.fields.filter(f => F.fieldIds.has(f.id));
  const totalAc = sum(list, f => f.acres);
  let html = `<div class="toolbar"><div><h2>Fields</h2><p>${list.length} of ${S.fields.length} fields · ${nf(totalAc)} ac · ${y} season</p></div>
    <div class="toolbar-actions"><button type="button" class="btn btn-primary" data-act="add-field">+ Add field</button></div></div>`;
  html += list.length ? `<div class="field-grid">${list.map(f => fieldCard(f, y)).join('')}</div>` : `<div class="card"><p class="muted">${S.fields.length ? 'No fields match these filters.' : 'No fields yet. Add your first field to get started.'}</p></div>`;
  html += `<section class="card"><div class="card-head"><div><h3>Crops &amp; default prices</h3><p class="sub">Defaults used when a field's season doesn't set its own expected yield or price</p></div>
    <button type="button" class="btn" data-act="add-crop">+ Add custom crop</button></div>
    <div class="table-wrap"><table class="rtable"><thead><tr><th>Crop</th><th>Unit</th><th class="num">Default price</th><th class="num">Expected yield</th><th class="num">Days to harvest</th><th>Growth stages</th><th><span class="sr-only">Actions</span></th></tr></thead><tbody>
    ${S.crops.map(c => `<tr><td class="rt-title" data-label="Crop"><span class="crop-name"><i class="dot" style="--c:${cropVar(c)}"></i>${esc(c.name)}</span>${c.builtin ? '' : ' <span class="chip">Custom</span>'}</td>
      <td data-label="Unit">${esc(c.unit)}</td><td class="num" data-label="Default price">${fmtPrice(c.price, c.unit)}</td><td class="num" data-label="Expected yield">${fmtYield(c.expectedYield)} ${esc(c.unit)}</td>
      <td class="num" data-label="Days to harvest">${nf(c.seasonDays)} days</td><td data-label="Growth stages"><span class="small muted">${esc(c.stages.map(s => s.code).join(' · ') || '—')}</span></td>
      <td class="actions"><button type="button" class="icon-btn" data-act="edit-crop" data-id="${esc(c.id)}" aria-label="Edit ${esc(c.name)}">${ICON.edit}</button>${c.builtin ? '' : `<button type="button" class="icon-btn danger" data-act="del-crop" data-id="${esc(c.id)}" aria-label="Delete ${esc(c.name)}">${ICON.del}</button>`}</td></tr>`).join('')}
    </tbody></table></div></section>`;
  return html;
}
function fieldCard(f, y) {
  const p = plantingFor(f.id, y);
  const t = dn(today());
  const head = `<div class="fc-head"><div><h3>${esc(f.name)}</h3><p class="fc-meta">${nf(f.acres)} ac · ${esc(f.soil || 'Soil not set')} · ${f.irrigated ? 'Irrigated' : 'Dryland'}</p></div>${p ? (() => { const st = plantStatus(p); return `<span class="pill st-${st.key}">${st.label}</span>`; })() : '<span class="pill st-none">No crop</span>'}</div>
    ${f.location ? `<p class="fc-loc">${ICON.pin}<span>${esc(f.location)}</span></p>` : ''}`;
  const next = plantingFor(f.id, y + 1);
  const nextHtml = next && next.plantDate && dn(next.plantDate) <= t ? `<div class="next-season"><span class="chip">${y + 1} season</span><span class="crop-name"><i class="dot" style="--c:${cropVar(cropById(next.cropId))}"></i>${esc(cropById(next.cropId).name)}</span><span class="muted">planted ${fmtDate(next.plantDate)}, day ${t - dn(next.plantDate)}</span><button type="button" class="btn btn-ghost sm" data-act="set-year" data-id="${y + 1}">View ${y + 1}</button></div>` : '';
  const actions = (pp) => `<div class="fc-actions">${pp ? `<button type="button" class="btn sm" data-act="edit-planting" data-id="${esc(f.id)}">Edit crop &amp; stages</button>` : `<button type="button" class="btn btn-primary sm" data-act="edit-planting" data-id="${esc(f.id)}">Assign crop for ${y}</button>`}
    ${pp && plantStatus(pp).key !== 'planned' ? `<button type="button" class="btn sm" data-act="harvest" data-id="${esc(pp.id)}">${num(pp.actualYield) != null ? 'Edit harvest' : 'Record harvest'}</button>` : ''}
    <button type="button" class="btn btn-ghost sm" data-act="edit-field" data-id="${esc(f.id)}">Edit field</button>
    <button type="button" class="btn btn-ghost sm danger" data-act="del-field" data-id="${esc(f.id)}">Delete</button></div>`;
  if (!p) return `<article class="card field-card">${head}<p class="muted">No crop assigned for the ${y} season.</p>${nextHtml}<div><div class="small muted" style="margin-bottom:6px">Rotation history</div>${rotationHtml(f.id, y)}</div>${fieldTrialsHtml(f, y)}${actions(null)}</article>`;
  const c = cropById(p.cropId), e = econ(p), st = plantStatus(p), stages = stageInfo(p), { cur, next: nx } = currentStage(p, stages);
  const pl = dn(p.plantDate), eh = dn(p.expectedHarvest), hv = dn(p.harvestDate);
  const len = pl != null && eh != null ? Math.max(1, eh - pl) : (c.seasonDays || 1);
  let counter = '', pct = 0;
  if (pl == null) counter = '<span class="of">Set a planting date to start the season counter.</span>';
  else if (st.key === 'planned') counter = `<span class="big">${pl - t}</span><span class="of">days until planting on ${fmtDate(p.plantDate, true)}</span>`;
  else if (st.key === 'harvested') { const d = (hv ?? t) - pl; pct = 100; counter = `<span class="big">${d}</span><span class="of">days planting to harvest${p.harvestDate ? ` (${fmtDate(p.harvestDate)})` : ''}</span>`; }
  else { const d = t - pl; pct = clamp(d / len * 100, 0, 100); counter = `<span class="big">Day ${d}</span><span class="of">${st.key === 'ready' ? `${t - eh} days past expected harvest` : `of ~${len} · ${eh - t} days to expected harvest`}</span>`; }

    <div class="kv"><div><span>Costs</span><b>${money(e.costAc)}/ac</b></div><div><span>${e.harvested ? 'Yield' : 'Exp. yield'}</span><b>${fmtYield(e.yld)} ${esc(c.unit)}</b></div><div><span>${e.harvested ? 'Profit' : 'Proj. profit'}</span><b class="${e.netAc >= 0 ? 'pos' : 'neg'}">${signedMoney(e.netAc)}/ac</b></div></div>

/* ================= Inputs ================= */
function viewInputs() {
  const F = filt(), y = F.y;
  const fields = S.fields.filter(f => F.fieldIds.has(f.id));
  const rows = fields.map(f => {
    const p = plantingFor(f.id, y), ac = p ? pAcres(p) : f.acres, ins = F.inputs.filter(i => i.fieldId === f.id), cost = sum(ins, i => i.cost);
    return { f, p, ac, cost, n: sum(ins, i => i.n), P: sum(ins, i => i.p), K: sum(ins, i => i.k), cnt: ins.length };
  });
  const totAc = sum(rows, r => r.ac), totCost = sum(rows, r => r.cost);
  const cats = CATEGORIES.map(c => ({ c, total: sum(F.inputs.filter(i => i.category === c.id), i => i.cost) })).filter(x => x.total > 0).sort((a, b) => b.total - a.total);
  const maxCat = Math.max(...cats.map(x => x.total), 1);
  let list = F.inputs.slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''));

    ${rows.length ? `<div class="table-wrap"><table class="rtable"><thead><tr><th>Field</th><th>Crop</th><th class="num">Acres</th><th class="num">Entries</th><th class="num">Total cost</th><th class="num">Cost/ac</th><th class="num">N</th><th class="num">P₂O₅</th><th class="num">K₂O</th></tr></thead><tbody>

      <td class="num" data-label="Acres">${nf(r.ac)} ac</td><td class="num" data-label="Entries">${r.cnt}</td><td class="num" data-label="Total cost">${money(r.cost)}</td><td class="num" data-label="Cost/ac"><b>${money(r.ac ? r.cost / r.ac : 0, 2)}</b></td>
      <td class="num" data-label="N (lb/ac)">${nf(r.n)}</td><td class="num" data-label="P₂O₅ (lb/ac)">${nf(r.P)}</td><td class="num" data-label="K₂O (lb/ac)">${nf(r.K)}</td></tr>`; }).join('')}
    </tbody><tfoot><tr><td class="rt-title" data-label="">All fields shown</td><td data-label=""></td><td class="num" data-label="Acres">${nf(totAc)} ac</td><td class="num" data-label="Entries">${F.inputs.length}</td><td class="num" data-label="Total cost">${money(totCost)}</td><td class="num" data-label="Cost/ac">${money(totAc ? totCost / totAc : 0, 2)}</td><td data-label=""></td><td data-label=""></td><td data-label=""></td></tr></tfoot></table></div>` : '<p class="muted">No fields match these filters.</p>'}
  </section>

    <ul class="cat-bars">${cats.map(x => `<li><span>${esc(x.c.label)}</span><span class="track-sm" aria-hidden="true"><i style="width:${(x.total / maxCat * 100).toFixed(1)}%"></i></span><b>${money(x.total)} <span class="muted">· ${money(totAc ? x.total / totAc : 0, 2)}/ac</span></b></li>`).join('')}</ul></section>` : ''}

          <div class="small"><b>${esc(f.name || '—')}</b>${c ? ` · ${esc(c.name)}` : ''}${o.stage ? ` · stage ${esc(o.stage)}` : ''}</div>${o.note ? `<p class="obs-note">${esc(o.note)}</p>` : ''}</div>
          <div class="obs-actions"><button type="button" class="icon-btn" data-act="edit-obs" data-id="${o.id}" aria-label="Edit observation">${ICON.edit}</button><button type="button" class="icon-btn danger" data-act="del-obs" data-id="${o.id}" aria-label="Delete observation">${ICON.del}</button></div></article>`; }).join('')}</div>` : '<p class="muted">No observations for this selection yet.</p>'}

/* ================= Yield & profit ================= */
function viewYield() {
  const F = filt(), E = F.plantings.map(econ);
  const acres = sum(E, e => e.acres), rev = sum(E, e => e.revenue), cost = sum(E, e => e.cost), net = rev - cost, nH = E.filter(e => e.harvested).length;
  const pctCell = e => e.pct != null ? `<span class="${e.pct >= 1 ? 'pos' : 'neg'}">${e.pct >= 1 ? '+' : '−'}${Math.abs(Math.round((e.pct - 1) * 100))}%</span>` : '—';
  return `<div class="toolbar"><div><h2>Yield &amp; profit</h2><p>${nH} of ${E.length} fields harvested · ${nf(acres)} ac · ${F.y} season</p></div></div>
  <section class="tiles" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">
    <div class="tile"><div class="tile-label">Gross revenue</div><div class="tile-value">${moneyC(rev)}</div><div class="tile-sub">${money(acres ? rev / acres : 0)}/ac</div></div>
    <div class="tile"><div class="tile-label">Total costs</div><div class="tile-value">${moneyC(cost)}</div><div class="tile-sub">${money(acres ? cost / acres : 0)}/ac</div></div>
    <div class="tile"><div class="tile-label">Net profit</div><div class="tile-value ${net >= 0 ? 'pos' : 'neg'}">${net >= 0 ? '▲ ' : '▼ '}${moneyC(net)}</div><div class="tile-sub">${signedMoney(acres ? net / acres : 0)}/ac</div></div>
    <div class="tile"><div class="tile-label">Fields at a loss</div><div class="tile-value">${E.filter(e => e.net < 0).length}</div><div class="tile-sub">of ${E.length} fields this season</div></div>
  </section>
  <section class="card"><div class="card-head"><div><h3>Field economics</h3><p class="sub">Unharvested fields use expected yield and are marked Projected</p></div></div>
    ${E.length ? `<div class="table-wrap"><table class="rtable dense"><thead><tr><th>Field</th><th>Crop</th><th class="num">Acres</th><th class="num">Expected</th><th class="num">Actual</th><th class="num">vs exp.</th><th class="num">Price</th><th class="num">Gross revenue</th><th class="num">Total cost</th><th class="num">Cost/ac</th><th class="num">Net profit</th><th class="num">Profit/ac</th><th class="num">Break-even price</th><th class="num">Break-even yield</th><th><span class="sr-only">Actions</span></th></tr></thead><tbody>
    ${E.map(e => `<tr><td class="rt-title" data-label="Field">${esc(e.field.name)}${e.harvested ? '' : '<span class="proj">Projected</span>'}</td>
      <td data-label="Crop"><span class="crop-name"><i class="dot" style="--c:${cropVar(e.crop)}"></i>${esc(e.crop.name)}</span></td>
      <td class="num" data-label="Acres">${nf(e.acres)}</td><td class="num" data-label="Expected">${fmtYield(e.expY)} ${esc(e.crop.unit)}</td>
      <td class="num" data-label="Actual">${e.harvested ? `<b>${fmtYield(e.act)}</b> ${esc(e.crop.unit)}` : '<span class="muted">—</span>'}</td><td class="num" data-label="vs expected">${pctCell(e)}</td>
      <td class="num" data-label="Price">${fmtPrice(e.price, e.crop.unit)}</td><td class="num" data-label="Gross revenue">${money(e.revenue)}</td><td class="num" data-label="Total cost">${money(e.cost)}</td>
      <td class="num" data-label="Cost/ac">${money(e.costAc)}</td><td class="num" data-label="Net profit"><span class="${e.net >= 0 ? 'pos' : 'neg'}">${money(e.net)}</span></td>
      <td class="num" data-label="Profit/ac"><span class="${e.netAc >= 0 ? 'pos' : 'neg'}">${signedMoney(e.netAc)}</span></td>
      <td class="num" data-label="Break-even price">${fmtPrice(e.bePrice, e.crop.unit)}</td><td class="num" data-label="Break-even yield">${fmtYield(e.beYield)} ${esc(e.crop.unit)}</td>
      <td class="actions"><button type="button" class="btn sm${e.harvested ? '' : ' btn-primary'}" data-act="harvest" data-id="${e.p.id}">${e.harvested ? 'Edit' : 'Record harvest'}</button></td></tr>`).join('')}
    </tbody><tfoot><tr><td class="rt-title" data-label="">Total</td><td data-label=""></td><td class="num" data-label="Acres">${nf(acres)}</td><td data-label=""></td><td data-label=""></td><td data-label=""></td><td data-label=""></td>
      <td class="num" data-label="Gross revenue">${money(rev)}</td><td class="num" data-label="Total cost">${money(cost)}</td><td class="num" data-label="Cost/ac">${money(acres ? cost / acres : 0)}</td>
      <td class="num" data-label="Net profit"><span class="${net >= 0 ? 'pos' : 'neg'}">${money(net)}</span></td><td class="num" data-label="Profit/ac"><span class="${net >= 0 ? 'pos' : 'neg'}">${signedMoney(acres ? net / acres : 0)}</span></td><td data-label=""></td><td data-label=""></td><td data-label=""></td></tr></tfoot></table></div>` : '<p class="muted">No planted fields for this selection.</p>'}

/* ================= Charts ================= */
let charts = [];
let pluginsRegistered = false;
const chartMeta = new WeakMap();
const cropColor = c => css(c && c.slot ? `--crop-${c.slot}` : '--crop-x');
const theme = () => ({ ink: css('--ink'), ink2: css('--ink-2'), muted: css('--muted'), grid: css('--grid'), base: css('--line-strong'), surface: css('--surface'), font: css('--font-body') });
function hideTip() { const t = $('#chartTip'); if (t) t.classList.remove('show'); }
function destroyCharts() { charts.forEach(c => { try { c.destroy(); } catch (e) { /* ignore */ } }); charts = []; hideTip(); }

const crosshairPlugin = { id: 'ffCrosshair', afterDatasetsDraw(chart) {
  const m = chartMeta.get(chart.canvas); if (!m || !m.crosshair) return;
  const a = chart.tooltip && chart.tooltip.getActiveElements ? chart.tooltip.getActiveElements() : [];
  if (!a.length) return;
  const x = Math.round(a[0].element.x) + 0.5, { top, bottom } = chart.chartArea, ctx = chart.ctx;
  ctx.save(); ctx.strokeStyle = css('--line-strong'); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x, bottom); ctx.stroke(); ctx.restore();
} };
const valueLabelPlugin = { id: 'ffValueLabels', afterDatasetsDraw(chart) {
  const m = chartMeta.get(chart.canvas); if (!m || !m.valueLabel) return;
  const ctx = chart.ctx, horiz = chart.options.indexAxis === 'y', ds = chart.data.datasets[0], meta = chart.getDatasetMeta(0);
  ctx.save(); ctx.font = `600 12px ${css('--font-body')}`; ctx.fillStyle = css('--ink-2');
  meta.data.forEach((el, i) => {
    const v = ds.data[i]; if (v == null) return;
    const txt = m.valueLabel(v, i); if (!txt) return;
    if (horiz) { ctx.textAlign = v >= 0 ? 'left' : 'right'; ctx.textBaseline = 'middle'; ctx.fillText(txt, el.x + (v >= 0 ? 6 : -6), el.y); }
    else { ctx.textAlign = 'center'; ctx.textBaseline = v >= 0 ? 'bottom' : 'top'; ctx.fillText(txt, el.x, el.y + (v >= 0 ? -5 : 5)); }
  });
  ctx.restore();
} };
const refLinePlugin = { id: 'ffRefLine', afterDatasetsDraw(chart) {
  const m = chartMeta.get(chart.canvas); if (!m || !m.refLine) return;
  if (chart.options.indexAxis === 'y') {
    const x = Math.round(chart.scales.x.getPixelForValue(m.refLine.v)) + 0.5, { top, bottom } = chart.chartArea, c = chart.ctx;
    c.save(); c.strokeStyle = css('--ink-2'); c.lineWidth = 1; c.beginPath(); c.moveTo(x, top - 4); c.lineTo(x, bottom); c.stroke();
    c.font = `600 11px ${css('--font-body')}`; c.fillStyle = css('--ink-2'); c.textAlign = 'center'; c.textBaseline = 'bottom'; c.fillText(m.refLine.label, x, top - 6); c.restore(); return;

function buildRainConfig(RV) {

      borderWidth: 2, pointRadius: 0, pointHoverRadius: si === 0 ? 4 : 3, pointHoverBackgroundColor: col, pointHoverBorderColor: t.surface, pointHoverBorderWidth: 2, order: si === 0 ? 0 : 1 };
  });

  else { let d = RV.fromX(RV.x0); let [yy, mm] = [+d.slice(0, 4), +d.slice(5, 7)]; for (let k = 0; k < 24; k++) { mm++; if (mm > 12) { mm = 1; yy++; } const x = dn(`${yy}-${String(mm).padStart(2, '0')}-01`); if (x > RV.x1) break; ticks.push(x); } }
  const label = v => { const s = RV.fromX(Math.round(v)); const dt = new Date(dn(s) * DAY); const mo = dt.toLocaleDateString('en-US', { month: 'short', timeZone: 'UTC' }); return RV.mode === 'field' && s.slice(5, 7) === '01' ? `${mo} ’${s.slice(2, 4)}` : mo; };
  const valAt = (pts, x) => { let v = 0; for (const p of pts) { if (p.x <= x) v = p.y; else break; } return v; };

        const rows = RV.series.map((s, si) => ({ color: css(s.color), value: `${nf(valAt(datasets[si].data, x), 2)} in`, label: RV.mode === 'farm' ? `${s.label} to date` : 'Season to date' }));
        const day = RV.series[0].readings.find(r => r.date === date);
        return { title: RV.mode === 'farm' ? fmtDate(date) : fmtDate(date, true), rows, note: day ? `${nf(day.inches, 2)} in that day` : '' };
      } },

        y: { beginAtZero: true, grace: '8%', grid: { color: t.grid, drawTicks: false }, border: { display: false }, ticks: { color: t.muted, padding: 8, maxTicksLimit: 6, callback: v => `${v} in` } } } } } };
}

function mountCharts() {

/* ================= Modals ================= */
let lastFocus = null;
function openModal({ title, body, submitLabel = 'Save', onSubmit, danger = false, wide = false, onOpen, noSubmit = false, extraFoot = '' }) {
  const root = $('#modalRoot');
  if (!root.classList.contains('open')) lastFocus = document.activeElement;
  root.innerHTML = `<div class="modal-backdrop" data-close></div><div class="modal${wide ? ' wide' : ''}" role="dialog" aria-modal="true" aria-labelledby="mTitle"><form id="mForm" novalidate>
    <div class="modal-head"><h2 id="mTitle" tabindex="-1">${esc(title)}</h2><button type="button" class="icon-btn" data-close aria-label="Close">${ICON.close}</button></div>
    <div class="modal-body">${body}</div>
    <div class="modal-foot"><p class="form-error" id="mErr" role="alert"></p>${extraFoot}<button type="button" class="btn" data-close>${noSubmit ? 'Close' : 'Cancel'}</button>${noSubmit ? '' : `<button type="submit" class="btn ${danger ? 'btn-danger' : 'btn-primary'}">${esc(submitLabel)}</button>`}</div>
  </form></div>`;
  root.classList.add('open'); document.body.classList.add('modal-open');
  const form = $('#mForm');
  form.addEventListener('submit', ev => {
    ev.preventDefault(); if (!onSubmit) return closeModal();
    let err; try { err = onSubmit(form); } catch (e) { console.error(e); err = 'Something went wrong while saving. Check the values and try again.'; }
    if (err === false) return;
    if (err) { $('#mErr').textContent = err; return; }
    closeModal();
  });
  $$('[data-close]', root).forEach(b => b.addEventListener('click', closeModal));
  if (onOpen) onOpen(form);
  const fine = window.matchMedia && matchMedia('(pointer: fine)').matches;
  setTimeout(() => { const first = fine && form.querySelector('.modal-body input:not([type=radio]):not([type=file]):not([disabled]), .modal-body select:not([disabled])'); (first || $('#mTitle')).focus(); }, 20);
}
function closeModal() {
  const root = $('#modalRoot'); if (!root.classList.contains('open')) return;
  root.classList.remove('open'); root.innerHTML = ''; document.body.classList.remove('modal-open');
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
}
function confirmModal({ title, text, okLabel = 'Delete', onOk }) {

}
function toast(msg, action) {
  const root = $('#toast'), el = document.createElement('div'); el.className = 'toast';
  const s = document.createElement('span'); s.textContent = msg; el.append(s);
  if (action) { const b = document.createElement('button'); b.type = 'button'; b.textContent = action.label; b.addEventListener('click', () => { action.fn(); el.remove(); }); el.append(b); }
  root.replaceChildren(el); setTimeout(() => el.remove(), action ? 7000 : 3200);
}
function withUndo(msg, mutate) {

}

const radio = name => { const el = document.querySelector(`input[name="${name}"]:checked`); return el ? el.value : null; };

    body: `<div class="form-grid">
      <div class="fld span-2"><label for="cName">Crop name</label><input id="cName" type="text" value="${esc(d.name)}" placeholder="e.g. Sunflowers"${lock} autocomplete="off">${c && c.builtin ? '<span class="hint">Built-in crops keep their name and unit.</span>' : ''}</div>
      <div class="fld"><label for="cUnit">Yield unit</label><select id="cUnit"${lock}>${UNITS.map(u => `<option${u === d.unit ? ' selected' : ''}>${u}</option>`).join('')}</select></div>

    onSubmit: () => {
      const name = c && c.builtin ? c.name : val('cName');
      if (!name) return 'Enter a crop name.';

      const price = num(val('cPrice')), exp = num(val('cExp')), days = num(val('cDays'));

      const collect = () => ({ variety: val('pVar'), acres: num(val('pAcres')), plantDate: val('pPlant'), expectedHarvest: val('pExpH'), harvestDate: val('pHarv'), expectedYield: num(val('pExpY')), actualYield: num(val('pAct')), price: num(val('pPrice')), notes: val('pNotes') });

      $('#pPlant').addEventListener('change', refresh);
      $('#pExpH').addEventListener('input', e => { e.target.dataset.auto = '0'; });

    },
    onSubmit: () => {
      const y = +val('pYear'), cropId = val('pCrop');

      const other = plantingFor(fieldId, y);
      if (other && other !== p) return `${f.name} already has a crop for ${y}. Edit that season instead.`;
      const plant = val('pPlant'), eh = val('pExpH'), hv = val('pHarv');
      if (plant && eh && dn(eh) < dn(plant)) return 'Expected harvest must be after the planting date.';
      if (plant && hv && dn(hv) < dn(plant)) return 'Harvest date must be after the planting date.';
      const acres = num(val('pAcres'));
      if (acres != null && acres <= 0) return 'Planted acres must be more than 0, or leave it blank.';
      const stageActual = {};
      $$('#stageBox input').forEach(inp => { if (inp.value) stageActual[inp.dataset.code] = inp.value; });
      const c = cropById(cropId);
      const data = { year: y, cropId, variety: val('pVar'), acres, plantDate: plant || null, expectedHarvest: eh || (plant ? addDays(plant, c.seasonDays) : null), harvestDate: hv || null,

      if (p) Object.assign(p, data); else S.plantings.push(Object.assign({ id: uid('p'), fieldId }, data));
      if (y !== UI.year) UI.year = y;
      commit(); toast(`${f.name}: ${c.name} saved for ${y}`);
    } });
}

    extraFoot: e.harvested ? `<button type="button" class="btn btn-ghost danger" data-act="clear-harvest" data-id="${esc(p.id)}">Clear harvest</button>` : '',
    body: `<div class="form-grid">
      <p class="span-2 muted">${esc(c.name)} ${esc(p.variety)} · ${nf(ac)} ac · ${p.year} season</p>
