      <div class="fld"><span class="lbl" id="hModeLbl">Enter yield as</span><div class="choice" role="radiogroup" aria-labelledby="hModeLbl"><label><input type="radio" name="hMode" value="ac" checked><span>Per acre</span></label><label><input type="radio" name="hMode" value="total"><span>Field total</span></label></div></div>
      <div class="fld"><label for="hYield">Harvested yield</label>${unitField('hYield', e.act, c.unit, 'placeholder="0"')}</div>
      <div class="fld"><label for="hPrice">Sale price</label>${unitField('hPrice', p.price, '$/' + unitPer(c.unit), `placeholder="${nf(c.price, 2)}"`)}<span class="hint">Blank uses the ${esc(c.name)} default.</span></div>
      <div class="fld"><label for="hExp">Expected yield</label>${unitField('hExp', p.expectedYield, c.unit, `placeholder="${fmtYield(c.expectedYield)}"`)}</div>
      <div class="calc" id="hCalc" aria-live="polite"></div>
    </div>`,
    onOpen: () => {
      const per = () => { const v = num(val('hYield')); if (v == null) return null; return radio('hMode') === 'total' ? v / ac : v; };
      const upd = () => {
        const mode = radio('hMode'); $('#hYieldU').textContent = mode === 'total' ? unitPer(c.unit) : c.unit;

        const rev = y * ac * price, net = rev - e.cost;

      };
      $$('input[name="hMode"]').forEach(r => r.addEventListener('change', () => { const v = num(val('hYield')); if (v != null) $('#hYield').value = r2(radio('hMode') === 'total' ? v * ac : v / ac); upd(); }));

    },

async function doExport(kind) {

  const DD = chkRow ? D.concat([chkRow]).sort((a, b) => b.yld - a.yld) : D;
  const cDealer = chartCard({ key: 'trial-dealer', title: 'Average yield by dealer', sub: 'Mean of each dealer\'s weighed entries · bu/ac', height: Math.max(220, DD.length * 30 + 40),
    empty: D.length ? null : 'No weighed entries yet.', aria: `Bar chart of average dry yield by dealer: ${DD.map(d => `${d.dealer} ${nf(d.yld, 1)}`).join(', ')}`,

      rows: DD.map(d => [esc(d.dealer), d.items.length, nf(d.yld, 1) + ' bu/ac', d.moist != null ? nf(d.moist, 1) + '%' : '—', d.isCheck ? '—' : `${esc(d.best.name)} (${nf(d.best.yld, 1)})`]),
      bar: { vals: DD.map(d => d.yld), color: i => DD[i].isCheck ? 'var(--exp)' : 'var(--cost)', label: 'Avg yield' } },
    build: () => ({ type: 'bar', data: { labels: DD.map(d => d.dealer), datasets: [{ label: 'Average yield', data: DD.map(d => r2(d.yld)), backgroundColor: DD.map(d => css(d.isCheck ? '--exp' : '--cost')) }] },

  html += `<section class="card"><div class="card-head"><div><h3>Strip results</h3><p class="sub">Dry yield = harvest wt × (100 − moisture) ÷ (100 − ${nf(R.std, 1)}) ÷ ${R.lbBu} lb/bu ÷ strip acres. "vs checks" compares each entry with the average of the nearest weighed check strip on each side.</p></div>
    <div class="seg" role="group" aria-label="Sort strips"><button type="button" data-act="trial-sort" data-id="order" aria-pressed="${sort === 'order'}">Field order</button><button type="button" data-act="trial-sort" data-id="rank" aria-pressed="${sort === 'rank'}">Highest yield</button></div></div>
    <div class="table-wrap"><table class="rtable dense"><thead><tr><th class="num">Strip</th><th>Entry</th><th>Dealer</th><th class="num">Moisture</th><th class="num">Test wt</th><th class="num">Harvest wt</th><th class="num">Dry yield</th><th class="num">vs checks</th><th class="num">Rank</th><th class="num">Gross $/ac</th><th><span class="sr-only">Actions</span></th></tr></thead><tbody>
    ${rows.map(x => { const blank = x.yld == null, partial = blank && (x.moisture != null || x.testWeight != null); return `<tr class="${blank && !partial ? 'blank-row' : ''}${x.type !== 'entry' ? ' check-row' : ''}">
      <td class="num" data-label="Strip">${x.order}</td>
      <td class="rt-title" data-label="Entry">${esc(x.name)}${x.type === 'check' ? ' <span class="chip">Check</span>' : x.type === 'buffer' ? ' <span class="chip">Buffer</span>' : ''}</td>
      <td data-label="Dealer">${esc(x.dealer || '—')}</td>
      <td class="num" data-label="Moisture">${x.moisture != null ? nf(x.moisture, 1) + '%' : '—'}</td>
      <td class="num" data-label="Test wt">${x.testWeight != null ? nf(x.testWeight, 1) + ' lb/bu' : '—'}</td>
      <td class="num" data-label="Harvest wt">${x.weight != null ? nf(x.weight) + ' lb' : '—'}</td>
      <td class="num keep" data-label="Dry yield">${blank ? `<span class="muted">${x.type === 'buffer' ? 'Buffer' : partial ? 'No harvest weight' : 'Not weighed'}</span>` : `<b>${nf(x.yld, 1)}</b> bu/ac`}</td>
      <td class="num" data-label="vs checks">${x.vsCheck != null ? `<span class="${x.vsCheck >= 0 ? 'pos' : 'neg'}">${sgn(x.vsCheck)}</span>` : '—'}</td>
      <td class="num" data-label="Rank">${x.rank ? `${x.rank} of ${R.scored.length}` : '—'}</td>
      <td class="num" data-label="Gross $/ac">${x.rev != null ? money(x.rev) : '—'}</td>
      <td class="actions">${blank && x.type !== 'buffer' ? `<button type="button" class="btn sm" data-act="edit-entry" data-id="${esc(t.id)}|${esc(x.id)}">Enter data</button>` : `<button type="button" class="icon-btn" data-act="edit-entry" data-id="${esc(t.id)}|${esc(x.id)}" aria-label="Edit ${esc(x.name)}">${ICON.edit}</button>`}<button type="button" class="icon-btn danger" data-act="del-entry" data-id="${esc(t.id)}|${esc(x.id)}" aria-label="Delete ${esc(x.name)}">${ICON.del}</button></td></tr>`; }).join('')}
    </tbody></table></div>${t.notes ? `<p class="chart-note">${esc(t.notes)}</p>` : ''}</section>`;
  return html;
}

function buildTrialScatter(sc) {

  const mk = (arr, col, label) => ({ label, data: arr.map(x => ({ x: x.moisture, y: r2(x.yld), e: x })), backgroundColor: col, borderColor: t.surface, borderWidth: 2, pointRadius: 6, pointHoverRadius: 7, pointHitRadius: 10 });
  const top = ent.slice().sort((a, b) => b.yld - a.yld).slice(0, 3).map(x => ent.indexOf(x));
  return { custom: true, meta: { pointLabels: top,
      tip: tooltip => { const dp = tooltip.dataPoints[0], e = dp.raw.e; return { title: e.name + (e.type === 'entry' && e.dealer ? ' · ' + e.dealer : ''), rows: [{ color: dp.dataset.backgroundColor, value: `${nf(e.yld, 1)} bu/ac`, label: 'dry yield' }, { color: dp.dataset.backgroundColor, value: `${nf(e.moisture, 1)}%`, label: 'moisture' }], note: `${e.testWeight != null ? nf(e.testWeight, 1) + ' lb/bu test wt' : ''}${e.rank ? ` · rank ${e.rank}` : ''}` }; } },

          y: { grace: '5%', grid: { color: t.grid, drawTicks: false }, border: { display: false }, ticks: { color: t.muted, padding: 8, maxTicksLimit: 6 }, title: { display: true, text: 'Dry yield (bu/ac)', color: t.muted, font: { size: 12 } } } } } } };
}
const pointLabelPlugin = { id: 'ffPointLabels', afterDatasetsDraw(chart) {
  const m = chartMeta.get(chart.canvas); if (!m || !m.pointLabels) return;
  const meta = chart.getDatasetMeta(0), ds = chart.data.datasets[0], ctx = chart.ctx;
  ctx.save(); ctx.font = `600 12px ${css('--font-body')}`; ctx.fillStyle = css('--ink-2'); ctx.textBaseline = 'middle';

} };

    onOk: () => { const keep = S.trials || []; S = emptyState(); S.trials = keep; UI.crop = 'all'; UI.field = 'all'; UI.year = new Date().getFullYear(); UI.bannerDismissed = true; commit(); toast('Empty farm ready. Add your first field.'); ACTIONS.goto('fields'); } }),
  'reset-sample': () => confirmModal({ title: 'Reset to sample data?', text: 'This replaces everything saved in this browser with the sample farm.', okLabel: 'Reset to sample',
    onOk: () => { S = buildSample(); UI.crop = 'all'; UI.field = 'all'; UI.year = defaultYear(); UI.bannerDismissed = false; commit(); toast('Sample data restored'); } }),

  export: id => doExport(id),
  'copy-export': () => copyExport(),
  'import-paste': () => { const t = val('dPaste'); if (!t) { $('#importMsg').textContent = 'Paste the JSON first.'; return; } const err = importText(t); if (err) $('#importMsg').textContent = err; },
  'add-field': () => openFieldModal(null),
  'edit-field': id => openFieldModal(id),
  'del-field': id => { const f = fieldById(id); if (!f) return;
    const np = S.plantings.filter(p => p.fieldId === id).length, ni = S.inputs.filter(x => x.fieldId === id).length, no = S.observations.filter(x => x.fieldId === id).length, nr = S.rainfall.filter(x => x.fieldId === id).length;
    confirmModal({ title: `Delete ${f.name}?`, text: `This also deletes its ${np} seasons, ${ni} input entries, ${no} observations and ${nr} rain readings from its own gauge.`, okLabel: 'Delete field',
      onOk: () => withUndo(`Deleted ${f.name}`, () => { S.fields = S.fields.filter(x => x.id !== id); S.plantings = S.plantings.filter(x => x.fieldId !== id); S.inputs = S.inputs.filter(x => x.fieldId !== id); S.observations = S.observations.filter(x => x.fieldId !== id); S.rainfall = S.rainfall.filter(x => x.fieldId !== id); (S.trials || []).forEach(t => { if (t.fieldId === id) t.fieldId = null; }); if (UI.field === id) UI.field = 'all'; }) }); },
  'edit-planting': id => openPlantingModal(id, UI.year),
  'del-planting': id => { const p = S.plantings.find(x => x.id === id); if (!p) return; closeModal(); withUndo(`Removed ${cropById(p.cropId).name} from ${(fieldById(p.fieldId) || {}).name} ${p.year}`, () => { S.plantings = S.plantings.filter(x => x.id !== id); }); },
  harvest: id => openHarvestModal(id),
  'clear-harvest': id => { const p = S.plantings.find(x => x.id === id); if (!p) return; closeModal(); withUndo('Harvest cleared', () => { p.actualYield = null; p.harvestDate = null; }); },
  'add-crop': () => openCropModal(null),
  'edit-crop': id => openCropModal(id),
  'del-crop': id => { const c = cropById(id); const used = S.plantings.filter(p => p.cropId === id).length; if (used) { toast(`${c.name} is used by ${used} season${used > 1 ? 's' : ''}. Change those first.`); return; } withUndo(`Deleted ${c.name}`, () => { S.crops = S.crops.filter(x => x.id !== id); }); },
  'add-input': () => openInputModal(null),
  'edit-input': id => openInputModal(id),
  'del-input': id => withUndo('Input deleted', () => { S.inputs = S.inputs.filter(x => x.id !== id); }),
  'add-obs': () => openObsModal(null),
  'edit-obs': id => openObsModal(id),
  'del-obs': id => withUndo('Observation deleted', () => { S.observations = S.observations.filter(x => x.id !== id); }),
  'edit-rain': id => openRainModal(id),
  'del-rain': id => withUndo('Rain reading deleted', () => { S.rainfall = S.rainfall.filter(x => x.id !== id); if (String(id).startsWith('auto-')) S.settings.hiddenAuto = [...new Set([...(S.settings.hiddenAuto || []), id])]; }),
  'toggle-view': id => { UI.tableView[id] = !UI.tableView[id]; render(); },
  'yield-unit': id => { UI.yieldUnit = id; render(); },
  'compare-metric': id => { UI.compareMetric = id; render(); },
  'more-inputs': () => { UI.showAllInputs = true; render(); },
  'more-rain': () => { UI.showAllRain = true; render(); },
  'import-trial': () => openTrialImportModal(),
  'add-trial': () => openTrialModal(null),
  'edit-trial': id => openTrialModal(id),
  'del-trial': id => { const t = S.trials.find(x => x.id === id); if (!t) return; confirmModal({ title: `Delete ${t.name}?`, text: `This deletes the trial and its ${t.entries.length} strips.`, okLabel: 'Delete trial',
    onOk: () => withUndo(`Deleted ${t.name}`, () => { S.trials = S.trials.filter(x => x.id !== id); }) }); },
  'trial-sort': id => { UI.trialSort = id; render(); },
  'add-entry': id => openEntryModal(null, id),
  'edit-entry': id => openEntryModal(id),
  'open-trial': id => { const t = (S.trials || []).find(x => x.id === id); if (!t) return; UI.trialId = id; UI.year = t.year; UI.trialSort = 'order'; if (UI.field !== 'all' && t.fieldId && t.fieldId !== UI.field) UI.field = 'all'; ACTIONS.goto('trials'); },
  'field-add-trial': id => openFieldTrialChooser(id),
  'field-trial-import': id => openTrialImportModal({ fieldId: id }),
  'field-trial-new': id => { const f = fieldById(id); openTrialModal(null, { fieldId: id, name: f ? `${f.name} plot` : '' }); },
  'field-trial-link': id => { const [fid, tid] = String(id).split('|'); const t = (S.trials || []).find(x => x.id === tid), f = fieldById(fid); if (!t || !f) return; closeModal(); t.fieldId = fid; commit(); toast(`${t.name} is now on ${f.name}`); },
  'del-entry': id => { const { t, e } = findEntry(id); if (!e) return; withUndo(`Deleted strip ${e.order} (${e.name})`, () => { t.entries = t.entries.filter(x => x.id !== e.id); }); },
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const fn = ACTIONS[b.dataset.act]; if (!fn) return;
  e.preventDefault(); fn(b.dataset.id, b, e);
});
document.addEventListener('change', e => {
  const id = e.target.id;
  if (id === 'fYear') { UI.year = +e.target.value; if (UI.crop !== 'all' && !S.plantings.some(p => p.year === UI.year && p.cropId === UI.crop)) UI.crop = 'all'; UI.showAllInputs = false; UI.showAllRain = false; render(); }
  else if (id === 'fCrop') { UI.crop = e.target.value; render(); }
  else if (id === 'fField') { UI.field = e.target.value; render(); }
  else if (id === 'cmpField') { UI.compareField = e.target.value; render(); }
  else if (id === 'inCat') { UI.inputCat = e.target.value; UI.showAllInputs = false; render(); }
  else if (id === 'obsIssue') { UI.obsIssue = e.target.value; render(); }
  else if (id === 'trialSel') { UI.trialId = e.target.value; render(); }
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'rainQuick') return;
  e.preventDefault();
  const date = val('rqDate'), inches = num(val('rqIn')), gauge = val('rqGauge');
  if (!date) { toast('Enter the date'); return; }
  if (inches == null || inches <= 0) { toast('Enter the rain in inches'); $('#rqIn').focus(); return; }
  S.rainfall.push({ id: uid('r'), date, fieldId: gauge, inches: r2(inches) });
  commit(); toast(`Logged ${nf(inches, 2)} in for ${fmtDate(date)} at ${gaugeName(gauge)}`);
});
document.addEventListener('keydown', e => {
  const root = $('#modalRoot'); if (!root.classList.contains('open')) return;
  if (e.key === 'Escape') { e.preventDefault(); closeModal(); return; }
  if (e.key === 'Tab') {
    const f = $$('button, input, select, textarea, summary, [tabindex]:not([tabindex="-1"])', $('.modal')).filter(x => !x.disabled && x.offsetParent !== null);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});
window.addEventListener('scroll', hideTip, { passive: true });

function onHash() {
  const h = location.hash.replace('#', '');
  const t = TABS.some(x => x.id === h) ? h : 'dashboard';
  UI.tab = t; render();
}

/* ================= Init ================= */
(function init() {
  S = loadState();
  try { localStorage.setItem(UI_KEY + '.probe', '1'); localStorage.removeItem(UI_KEY + '.probe'); } catch (e) { storageOk = false; }
  UI = loadUI();
  if (!allYears().includes(UI.year)) UI.year = defaultYear();
  if (UI.field !== 'all' && !fieldById(UI.field)) UI.field = 'all';
  if (UI.crop !== 'all' && !S.crops.some(c => c.id === UI.crop)) UI.crop = 'all';
  window.addEventListener('hashchange', onHash);
  window.onChartLib = () => { const was = chartLib; chartLib = window.Chart ? 'ready' : 'failed'; if (was !== chartLib) render(); };
  if (chartLib === 'loading') setTimeout(() => { if (chartLib === 'loading') { chartLib = window.Chart ? 'ready' : 'failed'; render(); } }, 9000);
  const rerender = () => { if (!$('#modalRoot').classList.contains('open')) render(); };
  if (window.matchMedia) { const mq = matchMedia('(prefers-color-scheme: dark)'); if (mq.addEventListener) mq.addEventListener('change', rerender); }
  new MutationObserver(rerender).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  let wBucket = window.innerWidth < 560, rT = null;
  window.addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(() => { const b = window.innerWidth < 560; if (b !== wBucket) { wBucket = b; rerender(); } }, 250); });
  onHash();
  save();
  (async () => {
    try {
      if (!window.claude || typeof window.claude.use !== 'function') return;
      const db = await window.claude.use('db');
      if (!db) return;
      AUTO_STATE = 'loading'; rerender();
      let timer = setTimeout(() => { if (AUTO_STATE === 'loading') { AUTO_STATE = 'stale'; rerender(); } }, 10000);
      db.collection('rain').onSnapshot(snap => {
        AUTO_RAIN = snap.docs.map(d => d.data()).filter(Boolean);
        if (!snap.metadata.fromCache) { clearTimeout(timer); }
        AUTO_STATE = 'on'; rerender();
      }, () => { clearTimeout(timer); AUTO_STATE = 'stale'; rerender(); });
    } catch (e) { /* page works without automatic rain */ }
  })();
  initDownloads(); setTimeout(() => { if (!downloadsApi) initDownloads(); }, 1500);
})();
</script>
</body>
