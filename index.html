      commit(); toast(`${ppKindLabel(data.kind)} of ${fmtPrice(p, c.unit)} ${x ? 'saved' : 'added to the ' + c.name.toLowerCase() + ' chart'}`);
    } });
}

function openSaleModal(id) {
  const x = id ? (S.sales || []).find(v => v.id === id) : null;
  const defCrop = UI.crop !== 'all' ? UI.crop : ((S.plantings.find(p => p.year === UI.year) || {}).cropId || 'corn');
  const d = x || { date: today(), year: UI.year, cropId: defCrop, fieldId: UI.field !== 'all' ? UI.field : null, buyer: '', type: 'cash', ref: '', quantity: null, price: null, futures: null, futuresMonth: '', moisture: null, testWeight: null, deductions: null, delivered: true, deliverBy: null, notes: '' };
  const buyers = [...new Set((S.sales || []).map(v => v.buyer).filter(Boolean))].sort();
  const c0 = cropById(d.cropId), u0 = unitPer(c0.unit);
  const num4 = v => v == null ? '' : String(Math.round(v * 10000) / 10000);
  openModal({ title: x ? 'Edit sale' : 'Record a sale', submitLabel: x ? 'Save sale' : 'Add sale', wide: true,
    body: `<div class="form-grid">
      <div class="fld"><label for="sDate">Date sold or contracted</label><input id="sDate" type="date" value="${esc(d.date || '')}"></div>
      <div class="fld"><label for="sYear">Season (crop year)</label>${yearSelect('sYear', d.year)}</div>
      <div class="fld"><label for="sCrop">Crop</label><select id="sCrop">${S.crops.map(c => `<option value="${esc(c.id)}"${c.id === d.cropId ? ' selected' : ''}>${esc(c.name)}</option>`).join('')}</select></div>
      <div class="fld"><label for="sField">Field</label><select id="sField"><option value="">Whole farm, not one field</option>${S.fields.map(f => `<option value="${esc(f.id)}"${f.id === d.fieldId ? ' selected' : ''}>${esc(f.name)}</option>`).join('')}</select></div>
      <div class="fld"><label for="sBuyer">Buyer</label><input id="sBuyer" type="text" list="sBuyerList" value="${esc(d.buyer)}" placeholder="Elevator, ethanol plant, feedlot" autocomplete="off"><datalist id="sBuyerList">${buyers.map(b => `<option value="${esc(b)}"></option>`).join('')}</datalist></div>
      <div class="fld"><label for="sRef">Contract or ticket #</label><input id="sRef" type="text" value="${esc(d.ref)}" autocomplete="off"></div>
      <div class="fld span-2"><span class="lbl" id="sTypeLbl">Type of sale</span><div class="choice" role="radiogroup" aria-labelledby="sTypeLbl">${SALE_TYPES.map(t => `<label><input type="radio" name="sType" value="${t.id}"${t.id === d.type ? ' checked' : ''}><span>${t.label}</span></label>`).join('')}</div></div>
      <div class="fld"><label for="sQty">Amount sold</label>${unitField('sQty', d.quantity, u0)}<span class="hint">Net amount from the settlement sheet or contract.</span></div>
      <div class="fld"><label for="sPrice">Price received</label>${unitField('sPrice', d.price, '$/' + u0)}<span class="hint">Before deductions. Leave blank if it isn't priced yet.</span></div>
      <div class="fld"><label for="sFut">Futures that day</label>${unitField('sFut', num4(d.futures), '$/' + u0)}<span class="hint" id="sFutHint"></span></div>
      <div class="fld"><label for="sFutM">Futures month</label><input id="sFutM" type="text" value="${esc(d.futuresMonth)}" placeholder="e.g. Dec 2026" autocomplete="off"></div>
      <div class="fld"><label for="sDed">Deductions</label>${unitField('sDed', d.deductions, '$')}<span class="hint">Drying, shrink, trucking and checkoff from the settlement sheet.</span></div>
      <div class="fld"><label for="sMoist">Moisture at delivery</label>${unitField('sMoist', d.moisture, '%')}</div>
      <div class="fld"><label for="sTw">Test weight</label>${unitField('sTw', d.testWeight, 'lb/bu')}</div>
      <div class="fld"><span class="lbl" id="sDelLbl">Delivered?</span><div class="choice" role="radiogroup" aria-labelledby="sDelLbl"><label><input type="radio" name="sDel" value="yes"${d.delivered ? ' checked' : ''}><span>Delivered</span></label><label><input type="radio" name="sDel" value="no"${d.delivered ? '' : ' checked'}><span>Not yet</span></label></div></div>
      <div class="fld" id="sByWrap"><label for="sBy">Deliver by</label><input id="sBy" type="date" value="${esc(d.deliverBy || '')}"></div>
      <div class="fld span-2"><label for="sNotes">Notes</label><input id="sNotes" type="text" value="${esc(d.notes)}" autocomplete="off"></div>
      <div class="calc" id="sCalc" aria-live="polite"></div>
    </div>`,
    onOpen: () => {
      const futTouched = { v: !!x }, monthTouched = { v: !!(x && x.futuresMonth) };
      $('#sFut').addEventListener('input', () => { futTouched.v = true; calc(); });
      $('#sFutM').addEventListener('input', () => { monthTouched.v = true; });
      const crop = () => cropById(val('sCrop'));
      const autoFut = () => {
        const c = crop(), date = val('sDate'), hint = $('#sFutHint');
        if (!MARKET_MAP[c.id]) { hint.textContent = 'This crop has no futures market. Leave blank.'; return; }
        const f = futuresOn(c.id, date);
        if (f && !futTouched.v) { $('#sFut').value = String(f.price); if (!monthTouched.v) { const q = marketQuote(c); $('#sFutM').value = q && q.contract && MARKET && dn(date) >= dn(String(MARKET.asOf).slice(0, 10)) - 5 ? q.contract.replace('-', ' ') : 'Nearby'; } }
        const lbl = c.id === 'sorghum' ? 'Corn' : ((MARKET && MARKET.quotes && MARKET.quotes[MARKET_MAP[c.id]]) || {}).label || c.name;
        hint.textContent = f ? `${lbl} futures closed at ${fmtPrice(f.price, c.unit)} on ${fmtDate(f.date, true)}. Change it if your contract used a different month.`
          : PRICE_HIST ? 'No market close found for that date. Type the futures price from your contract.' : 'Type the futures price from your contract or the market that day.';
        calc();
      };
      const calc = () => {
        const c = crop(), u = unitPer(c.unit), q = num(val('sQty')), p = num(val('sPrice')), f = num(val('sFut')), ded = num(val('sDed')) || 0;
        const parts = [];
        if (p != null && f != null) parts.push(`Basis ${fmtBasis(p - f, c.unit)} (${p - f < 0 ? 'under' : 'over'} futures)`);
        if (q != null && p != null) { const gross = q * p, net = gross - ded; parts.push(`gross ${money(gross)}`, `deductions ${money(ded)}`, `net ${money(net)} (${fmtPrice(q ? net / q : 0, c.unit)})`); }
        else if (q != null) parts.push(`${nf(q)} ${u}, not priced yet: counted at today's sell price of ${fmtPrice(c.price, c.unit)}`);
        $('#sCalc').textContent = parts.length ? parts.join(' · ') : 'Enter the amount and price to see the totals.';
      };
      const units = () => { const u = unitPer(crop().unit); $('#sQtyU').textContent = u; $('#sPriceU').textContent = '$/' + u; $('#sFutU').textContent = '$/' + u; };
      const del = () => { $('#sByWrap').hidden = radio('sDel') !== 'no'; };
      $('#sCrop').addEventListener('change', () => { futTouched.v = false; units(); autoFut(); });
      $('#sDate').addEventListener('change', () => { if (!x) futTouched.v = false; autoFut(); });
      ['sQty', 'sPrice', 'sDed'].forEach(i => $('#' + i).addEventListener('input', calc));
      $$('input[name="sDel"]').forEach(r => r.addEventListener('change', del));
      units(); del(); calc();
      loadPriceHistory().then(autoFut);
    },
    onSubmit: () => {
      const date = val('sDate'), cropId = val('sCrop'), q = num(val('sQty')), p = num(val('sPrice')), f = num(val('sFut')), ded = num(val('sDed'));
      if (!date) return 'Enter the date of the sale.';
      if (!S.crops.some(c => c.id === cropId)) return 'Choose a crop.';
      if (q == null || q <= 0) return 'Enter the amount sold.';
      if (p != null && p < 0) return 'The price can\'t be negative.';
      if (f != null && f < 0) return 'The futures price can\'t be negative.';
      if (ded != null && ded < 0) return 'Deductions can\'t be negative. Enter them as a positive number.';
      const data = { date, year: +val('sYear'), cropId, fieldId: val('sField') || null, buyer: val('sBuyer'), type: radio('sType') || 'cash', ref: val('sRef'),
        quantity: q, price: p, futures: f, futuresMonth: val('sFutM'), moisture: num(val('sMoist')), testWeight: num(val('sTw')), deductions: ded ?? 0,
        delivered: radio('sDel') !== 'no', deliverBy: radio('sDel') === 'no' ? (val('sBy') || null) : null, notes: val('sNotes') };
      if (x) Object.assign(x, data); else S.sales.push(normSale(Object.assign({ id: uid('s') }, data)));
      commit(); toast(`${x ? 'Saved' : 'Added'} ${cropById(cropId).name.toLowerCase()} sale: ${nf(q)} ${unitPer(cropById(cropId).unit)}`);
    } });
}

function viewYield() {
  const F = filt(), E = F.plantings.map(econ);
  const acres = sum(E, e => e.acres), rev = sum(E, e => e.revenue), cost = sum(E, e => e.cost), net = rev - cost, nH = E.filter(e => e.harvested).length;
  const pctCell = e => e.pct != null ? `<span class="${e.pct >= 1 ? 'pos' : 'neg'}">${e.pct >= 1 ? '+' : '−'}${Math.abs(Math.round((e.pct - 1) * 100))}%</span>` : '—';
  const cropsHere = [...new Set(E.map(e => e.crop.id))].map(cropById);
  const spCard = cropsHere.length ? `<section class="card"><div class="card-head"><div><h3>Sell prices</h3><p class="sub">Type a price to set it yourself, or choose Market to follow futures + your basis. A sale price typed when recording a harvest, or sales on the Sales tab, take priority for those bushels.</p></div></div>
    <div class="sp-list">${cropsHere.map(c => `<div class="sp-row"><span class="crop-name"><i class="dot" style="--c:${cropVar(c)}"></i>${esc(c.name)}</span>${sellPriceEditor(c, 'yield')}</div>`).join('')}</div></section>` : '';
  return `<div class="toolbar"><div><h2>Yield &amp; profit</h2><p>${nH} of ${E.length} fields harvested · ${nf(acres)} ac · ${F.y} season</p></div></div>
  <section class="tiles" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">
    <div class="tile"><div class="tile-label">Gross revenue</div><div class="tile-value">${moneyC(rev)}</div><div class="tile-sub">${money(acres ? rev / acres : 0)}/ac</div></div>
    <div class="tile"><div class="tile-label">Total costs</div><div class="tile-value">${moneyC(cost)}</div><div class="tile-sub">${money(acres ? cost / acres : 0)}/ac</div></div>
    <div class="tile"><div class="tile-label">Net profit</div><div class="tile-value ${net >= 0 ? 'pos' : 'neg'}">${net >= 0 ? '▲ ' : '▼ '}${moneyC(net)}</div><div class="tile-sub">${signedMoney(acres ? net / acres : 0)}/ac</div></div>
    <div class="tile"><div class="tile-label">Fields at a loss</div><div class="tile-value">${E.filter(e => e.net < 0).length}</div><div class="tile-sub">of ${E.length} fields this season</div></div>
  </section>
  ${spCard}
  <section class="card"><div class="card-head"><div><h3>Field economics</h3><p class="sub">Unharvested fields use expected yield and are marked Projected</p></div></div>
    ${E.length ? `<div class="table-wrap"><table class="rtable dense"><thead><tr><th>Field</th><th>Crop</th><th class="num">Acres</th><th class="num">Expected</th><th class="num">Actual</th><th class="num">vs exp.</th><th class="num">Price</th><th class="num">Gross revenue</th><th class="num">Total cost</th><th class="num">Cost/ac</th><th class="num">Net profit</th><th class="num">Profit/ac</th><th class="num">Break-even price</th><th class="num">Break-even yield</th><th><span class="sr-only">Actions</span></th></tr></thead><tbody>
    ${E.map(e => `<tr><td class="rt-title" data-label="Field">${esc(e.field.name)}${e.harvested ? '' : '<span class="proj">Projected</span>'}</td>
      <td data-label="Crop"><span class="crop-name"><i class="dot" style="--c:${cropVar(e.crop)}"></i>${esc(e.crop.name)}</span></td>
      <td class="num" data-label="Acres">${nf(e.acres)}</td><td class="num" data-label="Expected">${fmtYield(e.expY)} ${esc(e.crop.unit)}</td>
      <td class="num" data-label="Actual">${e.harvested ? `<b>${fmtYield(e.act)}</b> ${esc(e.crop.unit)}` : '<span class="muted">—</span>'}</td><td class="num" data-label="vs expected">${pctCell(e)}</td>
      <td class="num" data-label="Price">${fmtPrice(e.price, e.crop.unit)}${e.priceFrom === 'sales' ? '<div class="small muted">from sales</div>' : ''}</td><td class="num" data-label="Gross revenue">${money(e.revenue)}</td><td class="num" data-label="Total cost">${money(e.cost)}</td>
      <td class="num" data-label="Cost/ac">${money(e.costAc)}</td><td class="num" data-label="Net profit"><span class="${e.net >= 0 ? 'pos' : 'neg'}">${money(e.net)}</span></td>
      <td class="num" data-label="Profit/ac"><span class="${e.netAc >= 0 ? 'pos' : 'neg'}">${signedMoney(e.netAc)}</span></td>
      <td class="num" data-label="Break-even price">${fmtPrice(e.bePrice, e.crop.unit)}</td><td class="num" data-label="Break-even yield">${fmtYield(e.beYield)} ${esc(e.crop.unit)}</td>
      <td class="actions"><button type="button" class="btn sm${e.harvested ? '' : ' btn-primary'}" data-act="harvest" data-id="${esc(e.p.id)}">${e.harvested ? 'Edit' : 'Record harvest'}</button></td></tr>`).join('')}
    </tbody><tfoot><tr><td class="rt-title" data-label="">Total</td><td data-label=""></td><td class="num" data-label="Acres">${nf(acres)}</td><td data-label=""></td><td data-label=""></td><td data-label=""></td><td data-label=""></td>
      <td class="num" data-label="Gross revenue">${money(rev)}</td><td class="num" data-label="Total cost">${money(cost)}</td><td class="num" data-label="Cost/ac">${money(acres ? cost / acres : 0)}</td>
      <td class="num" data-label="Net profit"><span class="${net >= 0 ? 'pos' : 'neg'}">${money(net)}</span></td><td class="num" data-label="Profit/ac"><span class="${net >= 0 ? 'pos' : 'neg'}">${signedMoney(acres ? net / acres : 0)}</span></td><td data-label=""></td><td data-label=""></td><td data-label=""></td></tr></tfoot></table></div>` : '<p class="muted">No planted fields for this selection.</p>'}
    <p class="chart-note">Break-even price = total cost ÷ (yield × acres). Break-even yield = total cost ÷ (price × acres). Costs include every input logged for the field and season, land rent included.${E.some(e => e.priceFrom === 'sales') ? ' Prices marked “from sales” blend what you were paid for the bushels sold (Sales tab) with today\'s sell price for the rest.' : ''}${MARKET_STATE === 'on' ? ` Fields without a sale price use today's sell price (futures + basis, updated ${fmtDate(String(MARKET.asOf).slice(0, 10), true)}). Enter the sale price when you record a harvest to lock in what you were paid.` : ''}</p>
  </section>`;
}

/* ================= Charts ================= */
let charts = [];
let pluginsRegistered = false;
const chartMeta = new WeakMap();
const cropColor = c => css(c && c.slot ? `--crop-${c.slot}` : '--crop-x');
const theme = () => ({ ink: css('--ink'), ink2: css('--ink-2'), muted: css('--muted'), grid: css('--grid'), base: css('--line-strong'), surface: css('--surface'), font: css('--font-body') });
function hideTip() { const t = $('#chartTip'); if (t) t.classList.remove('show'); }
function destroyCharts() { charts.forEach(c => { try { c.destroy(); } catch (e) { /* ignore */ } }); charts = []; hideTip(); }

const crosshairPlugin = { id: 'ffCrosshair', afterDatasetsDraw(chart) {
  const m = chartMeta.get(chart.canvas); if (!m || !m.crosshair) return;
  const a = chart.tooltip && chart.tooltip.getActiveElements ? chart.tooltip.getActiveElements() : [];
  if (!a.length) return;
  const x = Math.round(a[0].element.x) + 0.5, { top, bottom } = chart.chartArea, ctx = chart.ctx;
  ctx.save(); ctx.strokeStyle = css('--line-strong'); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x, bottom); ctx.stroke(); ctx.restore();
} };
const valueLabelPlugin = { id: 'ffValueLabels', afterDatasetsDraw(chart) {
  const m = chartMeta.get(chart.canvas); if (!m || !m.valueLabel) return;
  const ctx = chart.ctx, horiz = chart.options.indexAxis === 'y', ds = chart.data.datasets[0], meta = chart.getDatasetMeta(0);
  ctx.save(); ctx.font = `600 12px ${css('--font-body')}`; ctx.fillStyle = css('--ink-2');
  meta.data.forEach((el, i) => {
    const v = ds.data[i]; if (v == null) return;
    const txt = m.valueLabel(v, i); if (!txt) return;
    if (horiz) { ctx.textAlign = v >= 0 ? 'left' : 'right'; ctx.textBaseline = 'middle'; ctx.fillText(txt, el.x + (v >= 0 ? 6 : -6), el.y); }
    else { ctx.textAlign = 'center'; ctx.textBaseline = v >= 0 ? 'bottom' : 'top'; ctx.fillText(txt, el.x, el.y + (v >= 0 ? -5 : 5)); }
  });
  ctx.restore();
} };
const refLinePlugin = { id: 'ffRefLine', afterDatasetsDraw(chart) {
  const m = chartMeta.get(chart.canvas); if (!m || !(m.refLine || (m.refLines && m.refLines.length))) return;
  if (m.refLine && chart.options.indexAxis === 'y') {
    const x = Math.round(chart.scales.x.getPixelForValue(m.refLine.v)) + 0.5, { top, bottom } = chart.chartArea, c = chart.ctx;
    c.save(); c.strokeStyle = css('--ink-2'); c.lineWidth = 1; c.beginPath(); c.moveTo(x, top - 4); c.lineTo(x, bottom); c.stroke();
    c.font = `600 11px ${css('--font-body')}`; c.fillStyle = css('--ink-2'); c.textAlign = 'center'; c.textBaseline = 'bottom'; c.fillText(m.refLine.label, x, top - 6); c.restore(); return;
  }
  const { left, right, top, bottom } = chart.chartArea, ctx = chart.ctx;
  for (const line of (m.refLines || [m.refLine])) {
    const y = Math.round(chart.scales.y.getPixelForValue(line.v)) + 0.5;
    if (y < top - 1 || y > bottom + 1) continue;
    ctx.save(); ctx.strokeStyle = line.color || css('--ink-2'); ctx.lineWidth = line.dash ? 1.5 : 1; if (line.dash) ctx.setLineDash(line.dash);
    ctx.beginPath(); ctx.moveTo(left, y); ctx.lineTo(right, y); ctx.stroke(); ctx.setLineDash([]);
    ctx.font = `600 11px ${css('--font-body')}`; ctx.fillStyle = css('--ink-2'); ctx.textAlign = line.align === 'left' ? 'left' : 'right'; ctx.textBaseline = 'bottom';
    ctx.fillText(line.label, line.align === 'left' ? left + 4 : right, y - 3); ctx.restore();
  }
} };
const endLabelPlugin = { id: 'ffEndLabel', afterDatasetsDraw(chart) {
  const m = chartMeta.get(chart.canvas); if (!m || !m.endLabel) return;
  const meta = chart.getDatasetMeta(0), pts = meta.data; if (!pts.length) return;
  const el = pts[pts.length - 1], ctx = chart.ctx;
  ctx.save(); ctx.font = `700 13px ${css('--font-body')}`; ctx.fillStyle = css('--ink'); ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
  ctx.fillText(m.endLabel, Math.min(el.x, chart.chartArea.right), el.y - 6);
  ctx.beginPath(); ctx.arc(el.x, el.y, 4, 0, Math.PI * 2); ctx.fillStyle = chart.data.datasets[0].borderColor; ctx.strokeStyle = css('--surface'); ctx.lineWidth = 2; ctx.fill(); ctx.stroke();
  ctx.restore();
} };

function externalTooltip(context) {

    rows = tooltip.dataPoints.map(dp => ({ color: Array.isArray(dp.dataset.backgroundColor) ? dp.dataset.backgroundColor[dp.dataIndex] : dp.dataset.backgroundColor,
      value: m.fmt ? m.fmt(dp.raw, dp) : String(dp.raw), label: chart.data.datasets.length > 1 ? dp.dataset.label : '' }));

function makeBarConfig(b) {

function buildRainConfig(RV) {
  const t = theme();
  const datasets = RV.series.map((s, si) => {
    let c = 0; const pts = [{ x: RV.x0, y: 0 }];
    for (const r of s.readings) { c += r.inches; pts.push({ x: RV.toX(r.date), y: r2(c) }); }
    const lastX = pts[pts.length - 1].x;
    if (s.end != null && s.end > lastX) pts.push({ x: s.end, y: r2(c) });
    const col = css(s.color);
    return { label: s.label, data: pts, borderColor: col, backgroundColor: si === 0 ? col + '1a' : 'transparent', fill: si === 0 ? 'origin' : false, stepped: 'before',
      borderWidth: 2, pointRadius: 0, pointHoverRadius: si === 0 ? 4 : 3, pointHoverBackgroundColor: col, pointHoverBorderColor: t.surface, pointHoverBorderWidth: 2, order: si === 0 ? 0 : 1 };
  });
  const ticks = [];
  if (RV.mode === 'farm') { const y = +RV.fromX(RV.x0 + 5).slice(0, 4); for (let mth = 0; mth < 12; mth++) { const x = dn(`${y}-${String(mth + 1).padStart(2, '0')}-01`) - yearStart(y) + 1; if (x >= RV.x0 && x <= RV.x1) ticks.push(x); } }
  else { let d = RV.fromX(RV.x0); let [yy, mm] = [+d.slice(0, 4), +d.slice(5, 7)]; for (let k = 0; k < 24; k++) { mm++; if (mm > 12) { mm = 1; yy++; } const x = dn(`${yy}-${String(mm).padStart(2, '0')}-01`); if (x > RV.x1) break; ticks.push(x); } }
  const label = v => { const s = RV.fromX(Math.round(v)); const dt = new Date(dn(s) * DAY); const mo = dt.toLocaleDateString('en-US', { month: 'short', timeZone: 'UTC' }); return RV.mode === 'field' && s.slice(5, 7) === '01' ? `${mo} ’${s.slice(2, 4)}` : mo; };
  const valAt = (pts, x) => { let v = 0; for (const p of pts) { if (p.x <= x) v = p.y; else break; } return v; };
  return { custom: true, meta: { crosshair: true, endLabel: `${nf(RV.total, 2)} in`,
      tip: tooltip => {
        const x = Math.round(tooltip.dataPoints[0].parsed.x), date = RV.fromX(x);
        const rows = RV.series.map((s, si) => ({ color: css(s.color), value: `${nf(valAt(datasets[si].data, x), 2)} in`, label: RV.mode === 'farm' ? `${s.label} to date` : 'Season to date' }));
        const day = RV.series[0].readings.find(r => r.date === date);
        return { title: RV.mode === 'farm' ? fmtDate(date) : fmtDate(date, true), rows, note: day ? `${nf(day.inches, 2)} in that day` : '' };
      } },
    config: { type: 'line', data: { datasets }, options: { responsive: true, maintainAspectRatio: false, animation: reduceMotion() ? false : { duration: 350 },
      layout: { padding: { top: 22, right: 10 } }, interaction: { mode: 'nearest', axis: 'x', intersect: false },
      plugins: { legend: { display: false }, tooltip: { enabled: false, external: externalTooltip } },
      scales: {
        x: { type: 'linear', min: RV.x0, max: RV.x1, grid: { display: false }, border: { color: t.base }, ticks: { color: t.ink2, autoSkip: false, maxRotation: 0, font: { size: 12 }, callback: v => label(v) }, afterBuildTicks: axis => { axis.ticks = ticks.map(v => ({ value: v })); } },
        y: { beginAtZero: true, grace: '8%', grid: { color: t.grid, drawTicks: false }, border: { display: false }, ticks: { color: t.muted, padding: 8, maxTicksLimit: 6, callback: v => `${v} in` } } } } } };
}

function mountCharts() {
  if (chartLib !== 'ready' || !window.Chart) return;
  if (!pluginsRegistered) { Chart.register(crosshairPlugin, valueLabelPlugin, refLinePlugin, endLabelPlugin, pointLabelPlugin); pluginsRegistered = true; }
  Chart.defaults.font.family = css('--font-body'); Chart.defaults.color = css('--muted');
  for (const spec of pendingCharts) {
    const canvas = document.getElementById('ch-' + spec.key);
    if (!canvas || canvas.parentElement.hidden) continue;
    try {
      const b = spec.build();
      const cfg = b.custom ? b.config : makeBarConfig(b);
      chartMeta.set(canvas, b.meta || {});
      charts.push(new Chart(canvas, cfg));
    } catch (e) { console.error('Chart failed', spec.key, e); }
  }
}

/* ================= Modals ================= */
let lastFocus = null;
function openModal({ title, body, submitLabel = 'Save', onSubmit, danger = false, wide = false, onOpen, noSubmit = false, extraFoot = '', cls = '' }) {
  const root = $('#modalRoot');
  if (!root.classList.contains('open')) lastFocus = document.activeElement;
  root.innerHTML = `<div class="modal-backdrop" data-close></div><div class="modal${wide ? ' wide' : ''}${cls ? ' ' + cls : ''}" role="dialog" aria-modal="true" aria-labelledby="mTitle"><form id="mForm" novalidate>
    <div class="modal-head"><h2 id="mTitle" tabindex="-1">${esc(title)}</h2><button type="button" class="icon-btn" data-close aria-label="Close">${ICON.close}</button></div>
    <div class="modal-body">${body}</div>
    <div class="modal-foot"><p class="form-error" id="mErr" role="alert"></p>${extraFoot}<button type="button" class="btn" data-close>${noSubmit ? 'Close' : 'Cancel'}</button>${noSubmit ? '' : `<button type="submit" class="btn ${danger ? 'btn-danger' : 'btn-primary'}">${esc(submitLabel)}</button>`}</div>
  </form></div>`;
  root.classList.add('open'); document.body.classList.add('modal-open');
  const form = $('#mForm');
  form.addEventListener('submit', ev => {
    ev.preventDefault(); if (!onSubmit) return closeModal();
    let err; try { err = onSubmit(form); } catch (e) { console.error(e); err = 'Something went wrong while saving. Check the values and try again.'; }
    if (err === false) return;
    if (err) { $('#mErr').textContent = err; return; }
    closeModal();
  });
  $$('[data-close]', root).forEach(b => b.addEventListener('click', closeModal));
  if (onOpen) onOpen(form);
  const fine = window.matchMedia && matchMedia('(pointer: fine)').matches;
  setTimeout(() => { const first = fine && form.querySelector('.modal-body input:not([type=radio]):not([type=file]):not([disabled]), .modal-body select:not([disabled])'); (first || $('#mTitle')).focus(); }, 20);
}
function closeModal() {
  const root = $('#modalRoot'); if (!root.classList.contains('open')) return;
  if (DMAP) { try { DMAP.remove(); } catch (e) { /* already gone */ } DMAP = null; }
  root.classList.remove('open'); root.innerHTML = ''; document.body.classList.remove('modal-open');
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
  if (SYNC.deferred) { SYNC.deferred = false; setTimeout(syncPoll, 50); }
}
function confirmModal({ title, text, okLabel = 'Delete', onOk }) {
  openModal({ title, body: `<p>${esc(text)}</p>`, submitLabel: okLabel, danger: true, onSubmit: () => { onOk(); } });
}
function toast(msg, action) {
  const root = $('#toast'), el = document.createElement('div'); el.className = 'toast';
  const s = document.createElement('span'); s.textContent = msg; el.append(s);
  if (action) { const b = document.createElement('button'); b.type = 'button'; b.textContent = action.label; b.addEventListener('click', () => { action.fn(); el.remove(); }); el.append(b); }
  root.replaceChildren(el); setTimeout(() => el.remove(), action ? 7000 : 3200);
}
function withUndo(msg, mutate) {
  const snap = JSON.stringify(S); mutate(); commit();
  toast(msg, { label: 'Undo', fn: () => { S = normalize(JSON.parse(snap)); commit(); toast('Restored'); } });
}
const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
const radio = name => { const el = document.querySelector(`input[name="${name}"]:checked`); return el ? el.value : null; };
function yearRange(extra) { const ys = allYears().concat(extra || []); const lo = Math.min(...ys) - 1, hi = Math.max(...ys, new Date().getFullYear() + 1) + 1; const out = []; for (let y = hi; y >= lo; y--) out.push(y); return out; }
const yearSelect = (id, sel) => `<select id="${id}">${yearRange([sel]).map(y => `<option value="${y}"${y === sel ? ' selected' : ''}>${y}</option>`).join('')}</select>`;

        $('#pExpHint').textContent = `${c.name} default: ${c.seasonDays} days after planting.`;
        $('#stageBox').innerHTML = c.stages.length ? c.stages.map((s, i) => `<div class="fld"><label for="st_${i}">${esc(s.code)} · ${esc(s.name)}</label><input type="date" id="st_${i}" data-code="${esc(s.code)}" value="${esc(typed[s.code] || '')}"><span class="hint">${plant ? 'Expected ' + fmtDate(addDays(plant, s.days), true) : `${s.days} days after planting`}</span></div>`).join('') : '<p class="muted small">This crop has no growth stages. Add them under Crops &amp; default prices.</p>';
      };
      const collect = () => ({ variety: val('pVar'), acres: num(val('pAcres')), plantDate: val('pPlant'), expectedHarvest: val('pExpH'), harvestDate: val('pHarv'), expectedYield: num(val('pExpY')), actualYield: num(val('pAct')), price: num(val('pPrice')), notes: val('pNotes') });
      $('#pCrop').addEventListener('change', refresh);
      $('#pPlant').addEventListener('change', refresh);
      $('#pExpH').addEventListener('input', e => { e.target.dataset.auto = '0'; });
      refresh();
    },
    onSubmit: () => {
      const y = +val('pYear'), cropId = val('pCrop');
      if (!S.crops.some(c => c.id === cropId)) return 'Choose a crop.';
      const other = plantingFor(fieldId, y);
      if (other && other !== p) return `${f.name} already has a crop for ${y}. Edit that season instead.`;
      const plant = val('pPlant'), eh = val('pExpH'), hv = val('pHarv');
      if (plant && eh && dn(eh) < dn(plant)) return 'Expected harvest must be after the planting date.';
      if (plant && hv && dn(hv) < dn(plant)) return 'Harvest date must be after the planting date.';
      const acres = num(val('pAcres'));
      if (acres != null && acres <= 0) return 'Planted acres must be more than 0, or leave it blank.';
      const stageActual = {};
      $$('#stageBox input').forEach(inp => { if (inp.value) stageActual[inp.dataset.code] = inp.value; });
      const c = cropById(cropId);
      const data = { year: y, cropId, variety: val('pVar'), acres, plantDate: plant || null, expectedHarvest: eh || (plant ? addDays(plant, c.seasonDays) : null), harvestDate: hv || null,
        expectedYield: num(val('pExpY')), actualYield: num(val('pAct')), price: num(val('pPrice')), stageActual, notes: val('pNotes') };
      if (p) Object.assign(p, data); else S.plantings.push(Object.assign({ id: uid('p'), fieldId }, data));
      if (y !== UI.year) UI.year = y;
      commit(); toast(`${f.name}: ${c.name} saved for ${y}`);
    } });
}

function openHarvestModal(pid) {

  const defDate = p.harvestDate || (dn(today()) > dn(p.plantDate || today()) ? today() : (p.expectedHarvest || today()));

    extraFoot: e.harvested ? `<button type="button" class="btn btn-ghost danger" data-act="clear-harvest" data-id="${esc(p.id)}">Clear harvest</button>` : '',
    body: `<div class="form-grid">
      <p class="span-2 muted">${esc(c.name)} ${esc(p.variety)} · ${nf(ac)} ac · ${p.year} season</p>
      <div class="fld"><label for="hDate">Harvest date</label><input id="hDate" type="date" value="${esc(defDate)}"></div>
      <div class="fld"><span class="lbl" id="hModeLbl">Enter yield as</span><div class="choice" role="radiogroup" aria-labelledby="hModeLbl"><label><input type="radio" name="hMode" value="ac" checked><span>Per acre</span></label><label><input type="radio" name="hMode" value="total"><span>Field total</span></label></div></div>
      <div class="fld"><label for="hYield">Harvested yield</label>${unitField('hYield', e.act, c.unit, 'placeholder="0"')}</div>
      <div class="fld"><label for="hPrice">Sale price</label>${unitField('hPrice', p.price, '$/' + unitPer(c.unit), `placeholder="${nf(c.price, 2)}"`)}<span class="hint">Blank uses the ${esc(c.name)} default.</span></div>
      <div class="fld"><label for="hExp">Expected yield</label>${unitField('hExp', p.expectedYield, c.unit, `placeholder="${fmtYield(c.expectedYield)}"`)}</div>
      <div class="calc" id="hCalc" aria-live="polite"></div>
    </div>`,
    onOpen: () => {
      const per = () => { const v = num(val('hYield')); if (v == null) return null; return radio('hMode') === 'total' ? v / ac : v; };
      const upd = () => {
        const mode = radio('hMode'); $('#hYieldU').textContent = mode === 'total' ? unitPer(c.unit) : c.unit;
        const y = per(), price = num(val('hPrice')) ?? c.price;
        if (y == null) { $('#hCalc').textContent = `Costs so far: ${money(e.cost)} (${money(e.costAc)}/ac). Break-even yield at ${fmtPrice(price, c.unit)}: ${fmtYield(price * ac ? e.cost / (price * ac) : null)} ${c.unit}.`; return; }
        const rev = y * ac * price, net = rev - e.cost;
        $('#hCalc').textContent = `${fmtYield(y)} ${c.unit} · ${nf(y * ac)} ${unitPer(c.unit)} total · revenue ${money(rev)} · net ${money(net)} (${signedMoney(net / ac, 2)}/ac)`;
      };
      $$('input[name="hMode"]').forEach(r => r.addEventListener('change', () => { const v = num(val('hYield')); if (v != null) $('#hYield').value = r2(radio('hMode') === 'total' ? v * ac : v / ac); upd(); }));
      ['hYield', 'hPrice'].forEach(id => $('#' + id).addEventListener('input', upd));
      upd();
    },
    onSubmit: () => {
      const v = num(val('hYield')), date = val('hDate');

      if (!date) return 'Enter the harvest date.';

      p.actualYield = r2(radio('hMode') === 'total' ? v / ac : v);
      p.harvestDate = date; p.price = num(val('hPrice')); p.expectedYield = num(val('hExp'));
      commit(); toast(`${f.name}: ${fmtYield(p.actualYield)} ${c.unit} saved`);
    } });
}

async function doExport(kind) {
  const ex = EXPORTS[kind]; if (!ex) return;
  const name = ex.file(), text = ex.build();
  const out = $('#exportOut');
  if (out) { out.hidden = false; $('#exportText').value = text; $('#exportLbl').textContent = `${ex.label}: ${name}`; $('#exportHint').textContent = `${text.split('\n').length.toLocaleString()} lines · if the download didn't start, copy these contents into a file.`; }
  if (downloadsApi) {
    try { await downloadsApi.save({ filename: name, data: text }); toast(`Saved ${name}`); return; }
    catch (e) { const code = e && e.code; if (code === 'declined') { toast('Download cancelled'); return; } if (code === 'rate_limited') { toast('A download prompt is already open. Try again in a moment.'); return; } }
  }
  try {
    const blob = new Blob([text], { type: kind === 'json' ? 'application/json' : 'text/csv' }), url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000);
    toast(`Downloading ${name}`);
  } catch (e) { toast('Download blocked here. Copy the contents below.'); }
}
async function copyExport() {
  const ta = $('#exportText'); if (!ta) return;
  try { await navigator.clipboard.writeText(ta.value); toast('Copied to clipboard'); }
  catch (e) { ta.focus(); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (x) { ok = false; } toast(ok ? 'Copied to clipboard' : 'Select the text and copy it manually'); }
}
function importText(text) {
  let d;
  try { d = JSON.parse(text); } catch (e) { return 'That file isn\'t valid JSON. Use a file exported from this tracker.'; }
  if (d && d.data && Array.isArray(d.data.fields)) d = d.data;
  if (!d || !Array.isArray(d.fields)) return 'That JSON doesn\'t look like a tracker export: it has no fields list.';
  if (needsPasscode()) { openUnlockModal(openDataModal); return null; }
  const n = normalize(d);
  confirmModal({ title: 'Replace all data?', text: `The file has ${n.fields.length} fields, ${n.plantings.length} seasons, ${n.inputs.length} input entries, ${n.observations.length} observations and ${n.rainfall.length} rain readings. Importing replaces everything saved in this browser now.${everyone()}`, okLabel: 'Import and replace',
    onOk: () => { S = n; S.sample = false; UI.crop = 'all'; UI.field = 'all'; UI.year = defaultYear(); UI.bannerDismissed = true; commit(); toast('Import complete'); } });

}

      $$('[data-ins]', $('#modalRoot')).forEach(b => b.addEventListener('click', () => { insertAtCursor(ta, b.dataset.ins); upd(); }));
      $('#fxReset').addEventListener('click', () => { ta.value = std; upd(); });
      upd();
    },
    onSubmit: () => {
      const src = $('#fxText').value.trim(), r = fxGet(src);
      if (!r.ok) return r.err || 'Check the formula.';
      if (fxEval(r.ok, FX_EXAMPLE) == null) return 'The formula doesn\'t give a number with sample values. Check that nothing is divided by zero.';
      c.yieldFormula = src.replace(/\s+/g, ' ') === std ? '' : src;
      commit(); toast(`${c.name} formula saved. Every ${c.name.toLowerCase()} trial was recalculated.`);
    } });
}

function trialCalc(t, formulaOverride) {
  const crop = cropById(t.cropId), lbBu = LB_PER_BU[t.cropId] || 56;
  const formula = formulaOverride != null ? String(formulaOverride) : cropFormula(crop), fx = fxGet(formula);
  const std = num(t.stdMoisture) ?? (STD_MOIST[t.cropId] ?? 15);
  const widthFt = (num(t.rows) || 0) * (num(t.rowSpacing) || 0) / 12;
  const price = num(t.price) ?? crop.price;
  const E = t.entries.slice().sort((a, b) => a.order - b.order).map(e => {
    const len = num(e.length) ?? num(t.stripLength);
    const acres = len && widthFt ? len * widthFt / 43560 : null;
    const vars = { weight: e.weight, M: e.moisture, length: len, rowWidth: num(t.rowSpacing), rows: num(t.rows), testWeight: e.testWeight, acres, lbPerBu: lbBu, stdMoisture: std };
    const yld = fx.ok && e.weight != null ? fxEval(fx.ok, vars) : null;
    const dryBu = yld != null && acres ? yld * acres : null;
    return Object.assign({}, e, { len, acres, dryBu, yld, rev: yld != null ? yld * price : null, rank: null, vsCheck: null, checkRef: null });
  });
  const checks = E.filter(x => x.type === 'check' && x.yld != null);
  for (const x of E) {
    if (x.yld == null || x.type !== 'entry') continue;
    const ref = [checks.filter(c => c.order < x.order).pop(), checks.find(c => c.order > x.order)].filter(Boolean);
    if (ref.length) { x.checkRef = sum(ref, c => c.yld) / ref.length; x.vsCheck = x.yld - x.checkRef; x.checkNames = ref.map(c => c.name); }
  }
  const scored = E.filter(x => x.type === 'entry' && x.yld != null).sort((a, b) => b.yld - a.yld);
  scored.forEach((x, i) => { x.rank = i + 1; });
  const avg = (arr, f) => { const v = arr.map(f).filter(z => z != null); return v.length ? sum(v) / v.length : null; };
  const dealers = [];
  for (const x of scored) { let g = dealers.find(d => d.dealer === (x.dealer || '—')); if (!g) { g = { dealer: x.dealer || '—', items: [] }; dealers.push(g); } g.items.push(x); }
  dealers.forEach(g => { g.yld = avg(g.items, x => x.yld); g.moist = avg(g.items, x => x.moisture); g.tw = avg(g.items, x => x.testWeight); g.best = g.items[0]; });
  dealers.sort((a, b) => b.yld - a.yld);
  return { t, crop, std, lbBu, widthFt, price, formula, fx, E, scored, checks, dealers, checkAvg: avg(checks, c => c.yld), plotAvg: avg(scored, x => x.yld),
    moistAvg: avg(scored, x => x.moisture), twAvg: avg(scored, x => x.testWeight), stripAcres: num(t.stripLength) && widthFt ? num(t.stripLength) * widthFt / 43560 : null };
}

  if (UI.crop !== 'all' && !S.crops.some(c => c.id === UI.crop)) UI.crop = 'all';
  window.addEventListener('hashchange', onHash);
  window.onChartLib = () => { const was = chartLib; chartLib = window.Chart ? 'ready' : 'failed'; if (was !== chartLib) render(); };
  if (chartLib === 'loading') setTimeout(() => { if (chartLib === 'loading') { chartLib = window.Chart ? 'ready' : 'failed'; render(); } }, 9000);
  const rerender = () => { if (!$('#modalRoot').classList.contains('open')) render(); };
  if (window.matchMedia) { const mq = matchMedia('(prefers-color-scheme: dark)'); if (mq.addEventListener) mq.addEventListener('change', rerender); }
  new MutationObserver(rerender).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  let wBucket = window.innerWidth < 560, rT = null;
  window.addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(() => { const b = window.innerWidth < 560; if (b !== wBucket) { wBucket = b; rerender(); } }, 250); });
  wxCacheLoad();
  onHash();
  localSave();
  syncStart();
  loadMarket(); loadForecast();
  setInterval(() => loadForecast(true), 60 * 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { loadForecast(); loadMarket(); } });
  (async () => {
    try {
      if (!window.claude || typeof window.claude.use !== 'function') return;
      const db = await window.claude.use('db');
      if (!db) return;
      AUTO_STATE = 'loading'; rerender();
      let timer = setTimeout(() => { if (AUTO_STATE === 'loading') { AUTO_STATE = 'stale'; rerender(); } }, 10000);
      db.collection('rain').onSnapshot(snap => {
        AUTO_RAIN = snap.docs.map(d => d.data()).filter(Boolean);
        if (!snap.metadata.fromCache) { clearTimeout(timer); }
        AUTO_STATE = 'on'; rerender();
      }, () => { clearTimeout(timer); AUTO_STATE = 'stale'; rerender(); });
    } catch (e) { /* page works without automatic rain */ }
  })();
  initDownloads(); setTimeout(() => { if (!downloadsApi) initDownloads(); }, 1500);
})();
</script>
